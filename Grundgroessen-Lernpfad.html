<title>Vom Elektroskop zum Stromkreis</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0f172a;--muted:#475569;--line:#d8dee8;--brand:#0f2a4a;--accent:#2563eb;--pos:#dc2626;--neg:#2563eb;--ok:#059669;--warn:#d97706;--el:#7c3aed;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
header h1{font-size:17px;margin:0;white-space:nowrap;font-weight:700}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;min-height:40px}
nav button.on{background:#fff;color:var(--brand)}
nav button .ck{color:#86efac;margin-left:4px}
main{max-width:1180px;margin:0 auto;padding:12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:60px}
h2{font-size:22px;margin:4px 0 6px}
h3{font-size:16.5px;margin:0 0 8px;color:var(--brand)}
.lead{margin:0 0 12px;color:var(--muted);font-size:16.5px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.real{border-left:5px solid var(--warn)}
.card.model{border-left:5px solid var(--el)}
.card.meter{border-left:5px solid var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (orientation:portrait),(max-width:860px){.grid2{grid-template-columns:1fr} header h1 .t{display:none}}
.stage{background:#f4f7fb;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stage svg{display:block;width:100%;height:auto;max-height:58vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}

<script>
"use strict";
/* ---------- Speicher (nur dieses Gerät) ---------- */
const LS={
  get(k,d){try{const v=localStorage.getItem("grund."+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("grund."+k,JSON.stringify(v));}catch(e){}},
  clear(){try{Object.keys(localStorage).filter(k=>k.indexOf("grund.")===0).forEach(k=>localStorage.removeItem(k));}catch(e){}}
};
const $=s=>document.querySelector(s);
const fmt=(x,d=1)=>(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d).replace(".",",");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const parseNum=s=>parseFloat(String(s).replace(",",".").replace(/\s/g,""));

/* ---------- Animationsschleife ---------- */
let anim=null,lastT=0;
function loop(t){const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;if(anim)anim(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* ---------- Zeichnen: Elektroskop (wie im Labor: Teller, Metallstab, Zeiger, Isolator, Gehäuse) ---------- */
function eskopAngle(q){return 75*(1-Math.exp(-Math.abs(q)/4));}
function eskop(cx,q,label,showCharges){
  const th=eskopAngle(q)*Math.PI/180, py=190, L=58;
  const dx=Math.sin(th)*L, dy=Math.cos(th)*L;
  let s=`<g>`;
  s+=`<circle cx="${cx}" cy="200" r="86" fill="#f8fafc" stroke="#94a3b8" stroke-width="7"/>`;
  // Skala
  for(let a=0;a<=80;a+=10){const r=a*Math.PI/180;s+=`<line x1="${cx+Math.sin(r)*68}" y1="${py-Math.cos(r)*68}" x2="${cx+Math.sin(r)*76}" y2="${py-Math.cos(r)*76}" stroke="#94a3b8" stroke-width="2"/>`;}
  s+=`<rect x="${cx-11}" y="104" width="22" height="20" rx="3" fill="#b45309"/>`;
  s+=`<line x1="${cx}" y1="58" x2="${cx}" y2="250" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>`;
  s+=`<rect x="${cx-48}" y="46" width="96" height="13" rx="4" fill="#94a3b8"/>`;
  s+=`<line x1="${cx-dx}" y1="${py+dy}" x2="${cx+dx}" y2="${py-dy}" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<circle cx="${cx}" cy="${py}" r="5" fill="#fff" stroke="#1e293b" stroke-width="2"/>`;
  if(showCharges&&Math.abs(q)>0.05){
    const n=Math.min(30,Math.round(Math.abs(q)*2)), neg=q<0, col=neg?"#2563eb":"#dc2626", sym=neg?"−":"+";
    const spots=[];
    for(let i=0;i<n;i++){
      const k=i%3;
      if(k===0){spots.push([cx-40+((i*37)%80),52]);}
      else if(k===1){spots.push([cx-12,70+((i*29)%160)]);}
      else{const f=((i*0.37)%1)*0.9+0.1;spots.push([cx+dx*f+8,py-dy*f]);}
    }
    spots.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${col}"/><text x="${p[0]}" y="${p[1]+4.5}" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">${sym}</text>`;});
  }
  if(label)s+=`<text x="${cx}" y="305" text-anchor="middle" font-size="17" font-weight="700" fill="#0f2a4a">${label}</text>`;
  return s+`</g>`;
}

/* ---------- Zeichnen: Stromkreis ---------- */
/* Batterie links (Pluspol oben), Bauteil rechts, Steckplätze: oben (vor dem Bauteil), unten (dahinter), Zweig rechts (parallel zum Bauteil) */
const P_MAIN=[[60,112],[60,40],[340,40],[340,220],[60,220],[60,148]];
const P_SHUNT=[[60,112],[60,40],[340,40],[340,80],[420,80],[420,180],[340,180],[340,220],[60,220],[60,148]];
function polyLen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L;}
function polyAt(p,s){for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(s<=l){const f=s/l;return[p[i-1][0]+(p[i][0]-p[i-1][0])*f,p[i-1][1]+(p[i][1]-p[i-1][1])*f];}s-=l;}return p[p.length-1];}
function meterSVG(x,y,letter,val,alarm){
  const col=letter==="A"?"#059669":"#ea580c";
  let s=`<rect x="${x-22}" y="${y-22}" width="44" height="44" rx="22" fill="#fff" stroke="${alarm?"#dc2626":col}" stroke-width="4"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="21" font-weight="800" fill="${col}">${letter}</text>`;
  const bx=x-46, by=x>400?190:y+(y>150?28:-56);
  s+=`<rect x="${bx}" y="${by}" width="92" height="28" rx="6" fill="${alarm?"#dc2626":"#0f172a"}"/><text x="${x}" y="${by+20}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Menlo,monospace">${val}</text>`;
  return s;
}
/* cfg: {comp:'lamp'|'res', glow:0..1, amp:null|'top'|'bottom'|'shunt', volt:null|'par'|'series', aVal, vVal, alarm, flow:'main'|'shunt'|'none'} */
function circuitSVG(cfg){
  let s=`<svg viewBox="0 -32 470 312" role="img" aria-label="Stromkreis">`;
  const W=`stroke="#334155" stroke-width="4" fill="none" stroke-linejoin="round"`;
  // Leitungen Hauptkreis (mit Lücken für Messgeräte in Reihe)
  const topGap=cfg.amp==="top"||cfg.volt==="series", botGap=cfg.amp==="bottom";
  s+=`<polyline points="60,112 60,40 ${topGap?"178,40":"340,40"}" ${W}/>`;
  if(topGap)s+=`<polyline points="222,40 340,40" ${W}/>`;
  s+=`<polyline points="340,40 340,108" ${W}/><polyline points="340,152 340,220 ${botGap?"222,220":"60,220"}" ${W}/>`;
  if(botGap)s+=`<polyline points="178,220 60,220" ${W}/>`;
  s+=`<polyline points="60,220 60,148" ${W}/>`;
  // Zweig rechts
  if(cfg.amp==="shunt"||cfg.volt==="par"){s+=`<polyline points="340,80 420,80 420,108" ${W}/><polyline points="420,152 420,180 340,180" ${W}/><circle cx="340" cy="80" r="5" fill="#334155"/><circle cx="340" cy="180" r="5" fill="#334155"/>`;}

    if(cfg.glow>0)s+=`<rect x="328" y="108" width="24" height="44" fill="rgba(234,88,12,${0.55*cfg.glow})"/>`;
  }else{
    const g=cfg.glow||0;
    if(g>0)s+=`<circle cx="340" cy="130" r="${30+16*g}" fill="rgba(253,224,71,${0.25+0.45*g})"/>`;
    s+=`<circle cx="340" cy="130" r="22" fill="${g>0?"#fef08a":"#fff"}" stroke="#334155" stroke-width="4"/><line x1="324" y1="114" x2="356" y2="146" stroke="#334155" stroke-width="3"/><line x1="356" y1="114" x2="324" y2="146" stroke="#334155" stroke-width="3"/>`;

  if(cfg.amp==="bottom")s+=meterSVG(200,220,"A",cfg.aVal,cfg.alarm);

  if(cfg.alarm)s+=`<text x="200" y="268" text-anchor="middle" font-size="20" font-weight="800" fill="#dc2626">⚠ KURZSCHLUSS</text>`;
  return s+`</svg>`;
}
/* bewegte Ladungsträger auf einem Pfad */
function makeFlow(svgSel,getState){
  let off=0;
  return dt=>{
    const st=getState(), g=document.querySelector(svgSel+" #dots"); if(!g)return;
    if(!st.path||st.speed<=0.01){g.innerHTML=st.path?drawDots(st.path,off,st.tech):"";return;}
    off+=st.speed*dt;
    g.innerHTML=drawDots(st.path,off,st.tech);
  };
}
function drawDots(path,off,tech){
  const L=polyLen(path), sp=30; let s="";
  for(let d=0;d<L;d+=sp){
    let pos=tech?((d+off)%L):(L-((d+off)%L)); if(pos<0)pos+=L;
    const p=polyAt(path,pos);
    if(tech)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6.5" fill="#dc2626" opacity=".85"/><text x="${p[0]}" y="${p[1]+4.5}" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">+</text>`;
    else s+=`<circle cx="${p[0]}" cy="${p[1]}" r="6.5" fill="#2563eb"/><text x="${p[0]}" y="${p[1]+4.5}" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">−</text>`;
  }
  return s;
}

   <div class="card"><h3>Versuch B: Ladung pro Zeit zählen</h3>
    <p class="small" style="margin:0 0 6px">Eine Batterie hält den Strom aufrecht. Wie „stark“ ist er? Stell dir eine Zählfläche quer durch den Draht vor und zähle, wie viele Portionen in einer bestimmten Zeit hindurchgehen.</p>
    <div class="stage"><svg id="zsvg" viewBox="0 0 600 170"></svg></div>

    zsvg.innerHTML=s;

  anim=dt=>{

/* ===== 3 Amperemeter ===== */
function renderAm(){
  let pos=LS.get("am.pos","none"), tech=false;
  $("#main").innerHTML=`
  <h2>3 · Wie baut man ein Amperemeter ein?</h2>
  <p class="lead">Ein Amperemeter misst die Stromstärke. Wo muss es sitzen? Leite es aus dem Modell ab und prüfe es dann am Stromkreis.</p>
  <div class="card model"><h3>Ableitung aus dem Modell</h3>
   <ol style="margin:0;padding-left:22px">
    <li>Stromstärke heißt: <b>Ladung pro Zeit durch einen Querschnitt</b> (Versuch B, Zählfläche).</li>
    <li>Das Amperemeter muss also selbst die Zählfläche sein. <b>Alle</b> Ladungen, die durch die Lampe fließen, müssen auch durch das Messgerät.</li>
    <li>Dafür muss man den Stromkreis <b>auftrennen</b> und das Messgerät in die Lücke setzen: Es liegt <b>in Reihe</b> zur Lampe.</li>
    <li>Das Messgerät soll den Strom nicht bremsen. Ein Amperemeter muss darum <b>fast keinen Widerstand</b> haben, es ist ein sehr guter Leiter.</li>
   </ol>
  </div>
  <div class="grid2">
   <div class="card"><div class="stage" id="amst"></div>
    <div class="lbl-s">Amperemeter einbauen</div>
    <div class="seg" id="ampos">
     <button class="btn" data-p="none">ohne</button><button class="btn" data-p="top">in Reihe, vor der Lampe</button><button class="btn" data-p="bottom">in Reihe, hinter der Lampe</button><button class="btn" data-p="shunt">parallel zur Lampe</button>
    </div>
    <div class="lbl-s">Darstellung</div>
    <div class="seg" id="amdir"><button class="btn on" data-t="0">Elektronen (− → +)</button><button class="btn" data-t="1">technische Stromrichtung (+ → −)</button></div>
   </div>
   <div class="card"><h3>Beobachtung</h3><div class="msg" id="ammsg"></div>
    ${think("Warum zeigen „vor der Lampe“ und „hinter der Lampe“ dasselbe an?","Die Ladung wird in der Lampe nicht verbraucht (Ladungserhaltung, V3 und V6). Was hineinfließt, fließt auch wieder hinaus. In einem unverzweigten Stromkreis ist die Stromstärke <b>überall gleich</b>.")}
    ${think("Was passiert, wenn man das Amperemeter parallel zur Lampe anschließt?","Das Amperemeter ist ein sehr guter Leiter. Fast alle Ladung nimmt diesen bequemen Umweg, an der Lampe vorbei. Die Lampe geht aus, der Strom wird riesig: ein <b>Kurzschluss</b>. Das Messgerät oder die Sicherung kann dabei kaputtgehen.")}
    <div class="merk"><b>Merke:</b> Das Amperemeter wird <b>in Reihe</b> zu dem Bauteil geschaltet, durch das der Strom gemessen werden soll. Es hat einen sehr kleinen Widerstand und darf <b>nie</b> parallel zu einem Bauteil oder direkt an die Batterie angeschlossen werden.</div>
   </div>
  </div>
  ${navBottom("am")}`;
  const TXT={
    none:["Die Lampe leuchtet. Wie groß ist die Stromstärke? Baue ein Amperemeter ein.",""],
    top:["Das Amperemeter zeigt 0,20 A. Die Lampe leuchtet genauso hell wie ohne Messgerät. Alle Ladungen fließen durch das Messgerät.","good"],
    bottom:["Auch hinter der Lampe zeigt das Amperemeter 0,20 A. Die Stromstärke ist überall im Kreis gleich.","good"],
    shunt:["Die Lampe ist aus! Die Ladung fließt fast vollständig durch das gut leitende Amperemeter an der Lampe vorbei. Der Strom ist viel zu groß: Kurzschluss.","bad"]
  };
  function draw(){
    const cfg={comp:"lamp",glow:pos==="shunt"?0:1,amp:pos==="none"?null:pos,aVal:pos==="shunt"?"> 10 A !":"0,20 A",alarm:pos==="shunt"};
    $("#amst").innerHTML=circuitSVG(cfg);
    $("#ammsg").textContent=TXT[pos][0];$("#ammsg").className="msg "+TXT[pos][1];
    $("#ampos").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===pos));
    LS.set("am.pos",pos);
  }
  $("#ampos").querySelectorAll("button").forEach(b=>b.onclick=()=>{pos=b.dataset.p;draw();});
  $("#amdir").querySelectorAll("button").forEach(b=>b.onclick=()=>{tech=b.dataset.t==="1";$("#amdir").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));});
  draw();
  anim=makeFlow("#amst",()=>({path:pos==="shunt"?P_SHUNT:P_MAIN,speed:pos==="shunt"?320:45,tech}));
}

/* ===== 4 Spannung ===== */
function renderU(){
  let s=0, E=0, flash=0, back=null;
  const MAX=10;
  $("#main").innerHTML=`
  <h2>4 · Die elektrische Spannung U</h2>
  <p class="lead">Ein Strom fließt nicht von allein. Im Versuch A floss er nur, solange das eine Elektroskop stärker geladen war als das andere. Was treibt die Ladung an?</p>
  <div class="card real"><h3>Erinnerung an das Labor</h3>
   <ul class="tight" style="margin:0">
    <li><b>V1/V5:</b> Beim Reiben werden positive und negative Ladungen <b>getrennt</b>. Dafür musst du Arbeit verrichten.</li>
    <li><b>V4/V5:</b> Getrennte, ungleichnamige Ladungen <b>ziehen sich an</b>. Sie „wollen“ wieder zusammen.</li>
    <li><b>V8:</b> Die elektrische Kraft hängt vom Abstand ab: Je näher, desto stärker.</li>
   </ul></div>
  <div class="grid2">
   <div class="card"><h3>Versuch C: Ladungen trennen</h3>
    <div class="stage"><svg id="usvg" viewBox="0 0 600 300"></svg></div>
    <div class="btns"><button class="btn primary" id="usep">Ein Elektron nach rechts bringen</button><button class="btn" id="uglow">Mit Glimmlampe verbinden</button></div>
    <div class="msg" id="umsg">Bringe Elektronen von der linken auf die rechte Platte.</div>
   </div>
   <div class="card"><h3>Messwerte</h3>
    <div class="kv"><span>Getrennte Elektronen</span><b id="us"></b></div>
    <div class="kv"><span>Arbeit für das letzte Elektron</span><b id="ue1"></b></div><div class="bar"><i id="ue1b" style="background:#ea580c"></i></div>
    <div class="kv"><span>Gespeicherte Energie insgesamt</span><b id="ue"></b></div><div class="bar"><i id="ueb" style="background:#7c3aed"></i></div>
    <p class="small" style="margin:4px 0 0">Energie in gedachten Einheiten</p>
    ${think("Warum wird es immer schwerer, noch ein Elektron hinüberzubringen?","Die rechte Platte ist schon negativ, sie stößt das neue Elektron ab. Die linke ist positiv, sie hält es fest (V5: gleichnamig stößt ab, ungleichnamig zieht an). Je mehr schon getrennt ist, desto mehr Arbeit kostet jedes weitere Elektron.")}
    ${think("Warum leuchtet die Glimmlampe heller, wenn mehr getrennt war?","Auf dem Rückweg gibt jede Ladung die Energie ab, die vorher beim Trennen hineingesteckt wurde. Je stärker getrennt war, desto mehr Energie bringt <b>jede einzelne Ladung</b> mit. Genau das misst die Spannung.")}
   </div>
  </div>
  <div class="card model"><h3>Die Spannung als Größe</h3>
   <p style="margin:0 0 6px">Die <b>Spannung U</b> beschreibt, wie stark die Ladungen in einer Quelle getrennt sind. Sie ist der <b>Antrieb</b> für den Strom. Genauer: Sie gibt an, wie viel Energie E jede Ladung Q auf ihrem Weg durch den Stromkreis abgeben kann.</p>
   <div class="formula">U = E / Q</div>
   <ul class="tight">
    <li>Einheit: <b>1 Volt (1 V)</b>. 1 V heißt: Jedes Coulomb Ladung kann 1 Joule Energie abgeben. 1 V = 1 J / C.</li>
    <li>Eine Batterie ist eine <b>Ladungspumpe</b>: Chemische Vorgänge trennen die Ladungen immer wieder, so bleibt die Spannung erhalten.</li>
    <li>Eine Spannung gibt es auch, wenn <b>kein</b> Strom fließt, so wie die getrennten Ladungen auf den Platten.</li>
    <li>Wasser-Modell: Die Spannung entspricht einem <b>Höhenunterschied</b>. Die Batterie ist eine Pumpe, die Wasser nach oben pumpt. Wasser fließt nur, wenn es einen Höhenunterschied gibt.</li>
   </ul>
   <p class="small" style="margin:0">Typische Werte: Batterie 1,5 V oder 4,5 V · Akku im Handy etwa 3,7 V · Steckdose 230 V · Blitz mehrere Millionen V.</p>
  </div>
  <div class="card"><h3>Denkfrage</h3>
   ${think("Spannung bezieht sich immer auf zwei Punkte. Warum?","Spannung heißt: Auf der einen Seite sind die Ladungen anders verteilt als auf der anderen. Man vergleicht immer zwei Stellen, wie beim Höhenunterschied zwischen zwei Orten. Darum spricht man von der Spannung „zwischen“ zwei Punkten.")}
  </div>
  ${navBottom("u")}`;
  const svg=$("#usvg");
  function draw(){
    if(!svg.isConnected)return;
    let t="";
    const g=flash;
    t+=`<rect x="110" y="40" width="22" height="200" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/><rect x="468" y="40" width="22" height="200" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>`;
    t+=`<text x="121" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">${s>0?"positiv":"neutral"}</text><text x="479" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">${s>0?"negativ":"neutral"}</text>`;
    // Ladungen: 10 Paare, die getrennten zeigen sich
    for(let i=0;i<MAX;i++){const y=55+i*18.5;
      t+=`<circle cx="121" cy="${y}" r="7" fill="#dc2626"/><text x="121" y="${y+4.5}" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">+</text>`;
      const away=i<s;
      if(!away){t+=`<circle cx="143" cy="${y}" r="7" fill="#2563eb"/><text x="143" y="${y+4.5}" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">−</text>`;}
      else{t+=`<circle cx="457" cy="${y}" r="7" fill="#2563eb"/><text x="457" y="${y+4.5}" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">−</text>`;}
      t+=`<circle cx="479" cy="${y}" r="7" fill="#dc2626"/><text x="479" y="${y+4.5}" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">+</text>`;
    }
    // Anziehung
    if(s>0){const w=2+s*1.2;t+=`<line x1="170" y1="140" x2="430" y2="140" stroke="#7c3aed" stroke-width="${w}" stroke-dasharray="10 8" opacity=".6"/><text x="300" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">Anziehung</text>`;}
    // Glimmlampe
    if(back!==null){
      t+=`<polyline points="121,40 121,14 280,14" fill="none" stroke="#334155" stroke-width="3"/><polyline points="320,14 479,14 479,40" fill="none" stroke="#334155" stroke-width="3"/>`;
      t+=`<ellipse cx="300" cy="14" rx="22" ry="11" fill="${g>0.02?`rgba(251,146,60,${0.3+0.7*g})`:"#f1f5f9"}" stroke="#334155" stroke-width="2.5"/>`;
      if(g>0.02)t+=`<circle cx="300" cy="14" r="${14+30*g}" fill="rgba(251,146,60,${0.35*g})"/>`;
    }
    // Höhenmodell
    t+=`<g transform="translate(250,175)"><rect x="0" y="0" width="100" height="80" fill="none"/>
      <rect x="0" y="${80-(40+s*3.5)}" width="38" height="${40+s*3.5}" fill="#93c5fd"/><rect x="62" y="${80-(40-s*3.5)}" width="38" height="${40-s*3.5}" fill="#93c5fd"/>
      <rect x="0" y="0" width="38" height="80" fill="none" stroke="#64748b" stroke-width="2"/><rect x="62" y="0" width="38" height="80" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="50" y="98" font-size="12" text-anchor="middle" fill="#475569">Wasser-Modell</text></g>`;
    svg.innerHTML=t;
    const e1=s;
    $("#us").textContent=s+" von "+MAX;
    $("#ue1").textContent=e1+" Einheiten";$("#ue1b").style.width=(e1/MAX*100)+"%";
    $("#ue").textContent=E+" Einheiten";$("#ueb").style.width=(E/55*100)+"%";
  }
  $("#usep").onclick=()=>{if(back!==null)return;if(s>=MAX){$("#umsg").textContent="Mehr geht hier nicht: Die Anziehung ist zu stark.";return;}s++;E+=s;
    $("#umsg").textContent=s===1?"Das erste Elektron war leicht. Bring noch weitere hinüber.":`Für das ${s}. Elektron brauchtest du ${s} Einheiten Arbeit. Es wird immer schwerer!`;draw();};
  $("#uglow").onclick=()=>{if(s===0){$("#umsg").textContent="Es sind keine Ladungen getrennt: Die Glimmlampe bleibt dunkel. Ohne Spannung kein Strom.";back=0;flash=0;draw();setTimeout(()=>{back=null;draw();},1200);return;}
    const s0=s;back=s0;flash=s0/MAX;$("#umsg").textContent=`Die Glimmlampe blitzt auf. Bei ${s0} getrennten Elektronen ist der Blitz ${s0>6?"hell":s0>3?"mittel":"schwach"}. Die gespeicherte Energie wird frei, die Platten sind wieder neutral.`;
    $("#usep").disabled=true;$("#uglow").disabled=true;
    const tick=()=>{if(!svg.isConnected)return;if(s>0){s--;draw();setTimeout(tick,90);}else{E=0;setTimeout(()=>{if(!svg.isConnected)return;back=null;flash=0;draw();$("#usep").disabled=false;$("#uglow").disabled=false;},400);}};tick();};
  anim=dt=>{if(back!==null&&flash>0&&s===0){flash=Math.max(0,flash-dt*1.5);draw();}};
  draw();
}

/* ===== 5 Voltmeter ===== */
function renderVm(){
  let pos=LS.get("vm.pos","none");
  $("#main").innerHTML=`
  <h2>5 · Wie baut man ein Voltmeter ein?</h2>
  <p class="lead">Ein Voltmeter misst die Spannung. Dein Elektroskop war eigentlich schon ein kleiner Spannungsmesser. Was kannst du daraus ableiten?</p>
  <div class="grid2">
   <div class="card"><h3>Das Elektroskop als Vorbild</h3><div class="stage"><svg viewBox="0 0 300 320">${eskop(150,-6,"",true)}
     <text x="150" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a4a">Anschluss 1: Teller</text>
     <text x="150" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#0f2a4a">Anschluss 2: Gehäuse / Erde</text>
     <text x="14" y="92" font-size="13" fill="#b45309" font-weight="700">Isolator</text><line x1="50" y1="98" x2="137" y2="113" stroke="#b45309" stroke-width="2"/></svg></div></div>
   <div class="card model"><h3>Ableitung aus dem Modell</h3>
    <ol style="margin:0;padding-left:22px">
     <li>Spannung gibt es immer <b>zwischen zwei Punkten</b>. Auch das Elektroskop hat zwei Anschlüsse: den Teller und das Gehäuse. Erdest du das Gehäuse nicht, misst es den Unterschied zwischen beiden.</li>
     <li>Ein Voltmeter braucht also zwei Anschlüsse, die man an die <b>beiden Enden</b> des Bauteils hält. Der Stromkreis bleibt dabei geschlossen. Das Voltmeter liegt <b>parallel</b> zum Bauteil.</li>
     <li>Das Elektroskop nimmt nur winzig wenig Ladung auf, der Isolator trennt es vom Gehäuse. So verändert es die gemessene Spannung kaum. Ein Voltmeter muss darum einen <b>sehr großen Widerstand</b> haben. Es soll fast keinen Strom abzweigen.</li>
    </ol>
   </div>
  </div>
  <div class="grid2">
   <div class="card"><div class="stage" id="vmst"></div>
    <div class="lbl-s">Voltmeter einbauen</div>
    <div class="seg" id="vmpos"><button class="btn" data-p="none">ohne</button><button class="btn" data-p="par">parallel zur Lampe</button><button class="btn" data-p="series">in Reihe</button></div>
   </div>
   <div class="card"><h3>Beobachtung</h3><div class="msg" id="vmmsg"></div>
    ${think("Warum geht die Lampe aus, wenn das Voltmeter in Reihe sitzt?","Das Voltmeter hat einen riesigen Widerstand, es wirkt fast wie ein Isolator (Kunststoffstab in Versuch A). Es fließt praktisch kein Strom mehr. Das Voltmeter zeigt dann ungefähr die ganze Batteriespannung, aber nicht die Spannung an der Lampe.")}
    ${think("Vergleiche: Amperemeter und Voltmeter","Amperemeter: <b>in Reihe</b>, sehr <b>kleiner</b> Widerstand, alle Ladung muss hindurch.<br>Voltmeter: <b>parallel</b>, sehr <b>großer</b> Widerstand, vergleicht zwei Punkte und lässt fast keine Ladung durch.")}
    <div class="merk"><b>Merke:</b> Das Voltmeter wird <b>parallel</b> zu dem Bauteil geschaltet, an dem die Spannung gemessen werden soll. Es hat einen sehr großen Widerstand, damit es den Stromkreis kaum beeinflusst.</div>
   </div>
  </div>
  ${navBottom("vm")}`;
  const TXT={
    none:["Die Lampe leuchtet. Welche Spannung liegt an ihr? Baue ein Voltmeter ein.",""],
    par:["Das Voltmeter zeigt 6,0 V an der Lampe. Die Lampe leuchtet weiter wie vorher, durch das Voltmeter fließt fast nichts.","good"],
    series:["Die Lampe ist aus! Das Voltmeter lässt kaum Ladung durch. Es zeigt etwa 6,0 V, die ganze Batteriespannung, weil es selbst die Lücke im Kreis bildet.","bad"]
  };
  function draw(){
    $("#vmst").innerHTML=circuitSVG({comp:"lamp",glow:pos==="series"?0:1,volt:pos==="none"?null:pos,vVal:"6,0 V"});
    $("#vmmsg").textContent=TXT[pos][0];$("#vmmsg").className="msg "+TXT[pos][1];
    $("#vmpos").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===pos));LS.set("vm.pos",pos);
  }
  $("#vmpos").querySelectorAll("button").forEach(b=>b.onclick=()=>{pos=b.dataset.p;draw();});
  draw();
  anim=makeFlow("#vmst",()=>({path:P_MAIN,speed:pos==="series"?0:45,tech:false}));
}

/* ===== 6 Widerstand ===== */
function renderR(){
  const COMP={a:{n:"Konstantandraht, 1 m",R:20},b:{n:"Konstantandraht, 2 m",R:40},c:{n:"Kunststoffstab",R:Infinity}};
  let comp=LS.get("r.comp","a"), U=6, rows=LS.get("r.rows",[]);
  $("#main").innerHTML=`
  <h2>6 · Der elektrische Widerstand R</h2>
  <p class="lead">In Versuch A floss die Ladung über Metall schnell, über Holz langsam und über Kunststoff gar nicht. Wie kann man diese „Hemmung“ messen?</p>
  <div class="grid2">
   <div class="card"><div class="stage" id="rst"></div>
    <div class="lbl-s">Bauteil</div>
    <div class="seg" id="rcomp">${Object.keys(COMP).map(k=>`<button class="btn" data-k="${k}">${COMP[k].n}</button>`).join("")}</div>
    <div class="lbl-s">Spannung der Quelle: <b id="ruv"></b></div><input type="range" id="ru" min="0" max="12" step="1" value="${U}">
    <div class="btns"><button class="btn primary" id="radd">Messwert in die Tabelle</button><button class="btn danger" id="rclr">Tabelle leeren</button></div>
   </div>
   <div class="card"><h3>Messtabelle</h3>
    <p class="small" style="margin:0">Das Amperemeter sitzt in Reihe, das Voltmeter parallel zum Bauteil, so wie du es abgeleitet hast.</p>
    <div id="rtab"></div>
    <div class="msg" id="rmsg">Miss bei mehreren Spannungen und vergleiche die letzte Spalte.</div>
   </div>
  </div>
  <div class="card model"><h3>Der Widerstand als Größe</h3>
   <p style="margin:0 0 6px">Je größer die Spannung (der Antrieb), desto größer die Stromstärke. Wie viel Spannung man für eine bestimmte Stromstärke braucht, hängt vom Bauteil ab. Das beschreibt der <b>Widerstand R</b>:</p>
   <div class="formula">R = U / I</div>
   <ul class="tight">
    <li>Einheit: <b>1 Ohm (1 Ω)</b>. 1 Ω = 1 V / A. Ein Bauteil hat 1 Ω, wenn bei 1 V ein Strom von 1 A fließt.</li>
    <li>Leiter haben einen kleinen Widerstand, Isolatoren einen riesigen.</li>
    <li>Bei vielen Metalldrähten ist U / I konstant (Ohmsches Gesetz). Ein längerer Draht hat einen größeren Widerstand.</li>
   </ul>
  </div>
  <div class="card"><h3>Denkfrage</h3>
   ${think("Jetzt wird klar, warum Messgeräte so gebaut sind. Erkläre!","Ein <b>Amperemeter</b> liegt in Reihe. Es soll den Strom nicht verkleinern, also braucht es einen <b>kleinen</b> Widerstand. Ein <b>Voltmeter</b> liegt parallel. Es soll keinen Strom abzweigen, also braucht es einen <b>großen</b> Widerstand.")}
  </div>
  ${navBottom("r")}`;
  const I=()=>COMP[comp].R===Infinity?0:U/COMP[comp].R;
  function draw(){
    const i=I();
    $("#rst").innerHTML=circuitSVG({comp:"res",compLabel:"Bauteil",glow:Math.min(1,i/0.6),amp:"bottom",volt:"par",aVal:fmt(i,2)+" A",vVal:fmt(U,1)+" V",bat:fmt(U,0)+" V"});
    $("#ruv").textContent=U+" V";
    $("#rcomp").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===comp));
    let h=`<table><tr><th>Bauteil</th><th>U in V</th><th>I in A</th><th>U / I in Ω</th></tr>`;
    rows.forEach(r=>{h+=`<tr><td>${r.c}</td><td>${fmt(r.u,1)}</td><td>${fmt(r.i,2)}</td><td>${r.i>0?fmt(r.u/r.i,0):(r.u>0?"sehr groß":"–")}</td></tr>`;});
    if(!rows.length)h+=`<tr><td colspan="4" class="small">noch keine Messwerte</td></tr>`;
    $("#rtab").innerHTML=h+"</table>";
    LS.set("r.rows",rows);LS.set("r.comp",comp);
  }
  $("#rcomp").querySelectorAll("button").forEach(b=>b.onclick=()=>{comp=b.dataset.k;draw();});
  $("#ru").oninput=e=>{U=+e.target.value;draw();};
  $("#radd").onclick=()=>{rows.push({c:COMP[comp].n.replace("Konstantandraht","Draht"),u:U,i:I()});if(rows.length>14)rows.shift();draw();
    const same=rows.filter(r=>r.c===rows[rows.length-1].c&&r.i>0);
    $("#rmsg").textContent=COMP[comp].R===Infinity?"Kunststoff: Trotz Spannung fließt kein Strom. Der Widerstand ist riesig, ein Isolator.":same.length>=2?`Bei diesem Draht ist U / I immer ${COMP[comp].R} Ω, egal welche Spannung. Das ist sein Widerstand.`:"Miss noch bei einer anderen Spannung.";};
  $("#rclr").onclick=()=>{rows=[];draw();};
  draw();
  anim=makeFlow("#rst",()=>({path:P_MAIN,speed:I()*90,tech:false}));
}

/* ===== Überblick ===== */
function renderSum(){
  $("#main").innerHTML=`
  <h2>Überblick: Die Grundgrößen</h2>
  <p class="lead">Fasse zuerst selbst zusammen, was du herausgefunden hast. Vergleiche dann mit der Tabelle.</p>
  <div class="card"><details><summary>Tabelle aufdecken</summary>
   <div style="overflow-x:auto"><table>
    <tr><th>Größe</th><th>Was sie bedeutet</th><th>Woher wir sie kennen</th><th>Einheit</th><th>Messgerät</th></tr>
    <tr><td><b>Ladung Q</b></td><td>Menge der überschüssigen oder fehlenden Elektronen</td><td>V6, V7: Ladungsportionen, Ausschlag</td><td>1 C = 1 A·s</td><td>(Elektroskop zeigt sie an)</td></tr>
    <tr><td><b>Stromstärke I</b></td><td>Ladung pro Zeit durch einen Querschnitt, I = Q / t</td><td>V3: Ladung fließt über einen Leiter</td><td>1 A = 1 C / s</td><td>Amperemeter, <b>in Reihe</b>, kleiner Widerstand</td></tr>
    <tr><td><b>Spannung U</b></td><td>Antrieb durch Ladungstrennung, Energie pro Ladung, U = E / Q</td><td>V1, V4, V5, V8: Trennen und Anziehung</td><td>1 V = 1 J / C</td><td>Voltmeter, <b>parallel</b>, großer Widerstand</td></tr>
    <tr><td><b>Widerstand R</b></td><td>Hemmung des Stroms, R = U / I</td><td>V3: Leiter und Isolatoren</td><td>1 Ω = 1 V / A</td><td>aus U und I berechnet</td></tr>
   </table></div></details></div>
  <div class="card"><h3>Schreibe in eigenen Worten</h3>
   <p class="small" style="margin:0 0 6px">Erkläre einer Mitschülerin oder einem Mitschüler, warum das Amperemeter in Reihe und das Voltmeter parallel geschaltet wird. (Wird nur auf diesem Gerät gespeichert.)</p>
   <textarea id="note" style="width:100%;min-height:110px;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:8px;font-family:inherit"></textarea>
  </div>
  ${navBottom("sum")}`;
  const n=$("#note");n.value=LS.get("note","");n.oninput=()=>LS.set("note",n.value);
}

/* ===== Selbsttest ===== */
const TEST=[
 {t:"mc",q:"Was bedeutet es, wenn ein Elektroskop keinen Ausschlag zeigt?",o:["Es enthält überhaupt keine Ladungen.","Es enthält gleich viele positive und negative Ladungen.","Es enthält nur positive Ladungen."],c:1,
  ex:"Neutral heißt: gleich viele positive und negative Ladungen. Ladungen sind immer da, sie heben sich nur in ihrer Wirkung auf (V6)."},
 {t:"mc",q:"In welcher Einheit gibt man die elektrische Ladung an?",o:["Volt (V)","Ampere (A)","Coulomb (C), also Amperesekunde (A·s)","Ohm (Ω)"],c:2,
  ex:"Die Ladung Q wird in Coulomb gemessen. Wegen I = Q / t gilt 1 C = 1 A · s."},
 {t:"mc",q:"Ein geladenes und ein ungeladenes Elektroskop werden mit einem Metalldraht verbunden. Was passiert?",o:["Nichts, Ladung kann nicht wandern.","Ladung fließt, bis beide gleich geladen sind. Für kurze Zeit fließt ein Strom.","Es fließt dauerhaft ein Strom.","Die Ladung verschwindet im Draht."],c:1,
  ex:"Über den Leiter gleicht sich die Ladung aus (V3). Das ist ein kurzer Strom. Für einen dauerhaften Strom braucht man eine Quelle, die die Ladungen immer wieder trennt."},
 {t:"num",q:"In 4 s fließen 2 C Ladung durch einen Draht. Wie groß ist die Stromstärke? (in A)",a:0.5,tol:0.01,u:"A",
  ex:"I = Q / t = 2 C / 4 s = 0,5 A"},
 {t:"mc",q:"Warum muss ein Amperemeter in Reihe geschaltet werden?",o:["Weil es die Spannung zwischen zwei Punkten vergleicht.","Weil alle Ladungen, die durch das Bauteil fließen, auch durch das Messgerät fließen müssen.","Weil es sonst zu wenig Energie bekommt.","Weil es einen sehr großen Widerstand hat."],c:1,
  ex:"Die Stromstärke ist die Ladung pro Zeit durch einen Querschnitt. Das Amperemeter muss selbst dieser Querschnitt sein, also im Kreis in Reihe liegen."},
 {t:"mc",q:"Ein Amperemeter wird versehentlich parallel zu einer Lampe angeschlossen. Was passiert?",o:["Es zeigt die richtige Stromstärke an.","Die Lampe leuchtet heller.","Kurzschluss: Die Lampe geht aus, ein sehr großer Strom fließt durch das Messgerät.","Es zeigt 0 A an, sonst passiert nichts."],c:2,
  ex:"Das Amperemeter hat einen sehr kleinen Widerstand. Fast die ganze Ladung fließt an der Lampe vorbei durch das Messgerät, ein Kurzschluss."},
 {t:"mc",q:"Ein Amperemeter vor der Lampe zeigt 0,3 A. Was zeigt ein zweites Amperemeter hinter der Lampe?",o:["weniger als 0,3 A, weil die Lampe Strom verbraucht","genau 0,3 A","mehr als 0,3 A","0 A"],c:1,
  ex:"Ladung wird nicht verbraucht (Ladungserhaltung). Im unverzweigten Stromkreis ist die Stromstärke überall gleich."},
 {t:"mc",q:"Was beschreibt die Spannung im Modell?",o:["Wie viele Elektronen in einem Draht sind.","Wie stark Ladungen getrennt sind, also den Antrieb für den Strom (Energie pro Ladung).","Wie schnell die Elektronen sind.","Wie dick ein Draht ist."],c:1,
  ex:"Beim Trennen verrichtet man Arbeit, die getrennten Ladungen ziehen sich an. Die Spannung gibt an, wie viel Energie jede Ladung auf dem Rückweg abgeben kann: U = E / Q."},
 {t:"mc",q:"Wie und warum schaltet man ein Voltmeter?",o:["In Reihe, weil alle Ladungen hindurch müssen.","Parallel zum Bauteil, weil es die beiden Enden vergleicht. Es hat einen großen Widerstand, damit fast kein Strom abgezweigt wird.","Parallel, weil es einen sehr kleinen Widerstand hat.","Es ist egal, wie man es anschließt."],c:1,
  ex:"Spannung gibt es zwischen zwei Punkten, wie beim Elektroskop zwischen Teller und Gehäuse. Darum parallel, mit sehr großem Widerstand."},
 {t:"mc",q:"Ein Voltmeter wird in Reihe zur Lampe geschaltet. Was beobachtet man?",o:["Die Lampe leuchtet normal und das Voltmeter zeigt die Lampenspannung.","Die Lampe geht aus, weil das Voltmeter mit seinem großen Widerstand fast keinen Strom durchlässt.","Es gibt einen Kurzschluss.","Das Voltmeter zeigt 0 V."],c:1,
  ex:"Der große Widerstand des Voltmeters wirkt wie ein Isolator. Es fließt fast kein Strom, die Lampe bleibt dunkel. Das Voltmeter zeigt etwa die Batteriespannung."},
 {t:"num",q:"An einem Draht liegt eine Spannung von 12 V. Es fließt ein Strom von 0,4 A. Wie groß ist der Widerstand? (in Ω)",a:30,tol:0.2,u:"Ω",
  ex:"R = U / I = 12 V / 0,4 A = 30 Ω"},
 {t:"mc",q:"In welche Richtung bewegen sich die Elektronen in einem Metalldraht?",o:["Vom Pluspol zum Minuspol","Vom Minuspol zum Pluspol","Sie bewegen sich gar nicht.","Mal so, mal so"],c:1,
  ex:"Elektronen sind negativ und werden vom Minuspol abgestoßen und vom Pluspol angezogen. Die technische Stromrichtung (+ → −) wurde festgelegt, bevor man die Elektronen kannte."}
];
let testState=null;
function renderTest(){
  if(!testState)testState=LS.get("test",{a:{},done:false});
  const st=testState, save=()=>LS.set("test",st);
  const mkPerm=()=>TEST.map(q=>{if(q.t!=="mc")return null;const a=q.o.map((_,j)=>j);for(let k=a.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]];}return a;});
  if(!st.perm||st.perm.length!==TEST.length){st.perm=mkPerm();save();}
  const answered=()=>TEST.filter((q,i)=>st.a[i]!==undefined&&st.a[i]!=="").length;
  const isRight=(q,i)=>q.t==="mc"?st.a[i]===q.c:Math.abs(parseNum(st.a[i])-q.a)<=q.tol;
  function render(){
    let h=`<h2>Selbsttest</h2><p class="lead">Beantworte alle ${TEST.length} Fragen. Erst dann kannst du dein Ergebnis und die Lösungen ansehen.</p>`;
    const n=answered();
    if(st.done){const sc=TEST.filter((q,i)=>isRight(q,i)).length;
      h+=`<div class="progress"><span class="score">${sc} von ${TEST.length} richtig</span><span>${sc===TEST.length?"Hervorragend!":sc>=TEST.length*0.75?"Gut gemacht!":sc>=TEST.length/2?"Schon ordentlich. Schau dir die Erklärungen an.":"Arbeite die Stationen noch einmal durch."}</span><button class="btn" id="tnew">Test neu starten</button></div>`;}
    else h+=`<div class="progress"><span><b>${n}</b> von ${TEST.length} beantwortet</span><div class="bar"><i style="width:${n/TEST.length*100}%"></i></div><button class="btn primary" id="teval" ${n<TEST.length?"disabled":""}>Auswerten und Lösungen zeigen</button></div>`;
    h+=`<div class="card">`;
    TEST.forEach((q,i)=>{
      h+=`<div class="q"><p class="qt">${i+1}. ${q.q}</p>`;
      if(q.t==="mc"){st.perm[i].forEach(j=>{const o=q.o[j];let c="opt";if(st.done){if(j===q.c)c+=" right";else if(st.a[i]===j)c+=" wrong";}else if(st.a[i]===j)c+=" sel";
        h+=`<button class="${c}" data-q="${i}" data-o="${j}" ${st.done?"disabled":""}>${o}</button>`;});}
      else{const v=st.a[i]!==undefined?String(st.a[i]).replace(/"/g,""):"";h+=`<input class="num ${st.done?(isRight(q,i)?"right":"wrong"):""}" data-q="${i}" inputmode="decimal" placeholder="Zahl" value="${v}" ${st.done?"disabled":""}> ${q.u}`;}
      if(st.done){const r=isRight(q,i);h+=`<div class="fb ${r?"ok":"no"}">${r?"✓ Richtig.":"✗ Leider falsch."} ${q.t==="num"&&!r?"Richtig ist "+fmt(q.a,q.a%1?1:0)+" "+q.u+". ":""}${q.ex}</div>`;}
      h+=`</div>`;
    });
    h+=`</div>`;
    if(!st.done)h+=`<p class="small">Du kannst deine Antworten bis zum Auswerten noch ändern.</p>`;
    $("#main").innerHTML=h;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.a[+b.dataset.q]=+b.dataset.o;save();const y=window.scrollY;render();window.scrollTo(0,y);});
    document.querySelectorAll("input.num").forEach(inp=>inp.oninput=()=>{const v=inp.value.trim();if(v===""||!isFinite(parseNum(v)))delete st.a[+inp.dataset.q];else st.a[+inp.dataset.q]=v;save();
      const k=answered();const pr=document.querySelector(".progress");if(pr){pr.querySelector("b").textContent=k;pr.querySelector(".bar i").style.width=(k/TEST.length*100)+"%";pr.querySelector("#teval").disabled=k<TEST.length;}});
    const ev=$("#teval");if(ev)ev.onclick=()=>{if(answered()<TEST.length)return;st.done=true;save();markDone("test");render();window.scrollTo(0,0);};
    const nw=$("#tnew");if(nw)nw.onclick=()=>{st.a={};st.done=false;st.perm=mkPerm();save();render();window.scrollTo(0,0);};
  }
  render();
}

window.go=go;window.markDone=markDone;
buildNav();go(STATIONS.some(s=>s.id===cur)?cur:"start");
</script>
