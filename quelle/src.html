<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Elektroskop-Labor 3D</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0f172a;--muted:#475569;--line:#d8dee8;--brand:#0f2a4a;--accent:#2563eb;--pos:#dc2626;--neg:#2563eb;--ok:#059669;--warn:#d97706;--el:#7c3aed;--hh:60px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
header h1{font-size:17px;margin:0;white-space:nowrap;font-weight:700}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;min-height:40px}
nav button.on{background:#fff;color:var(--brand)}
.switch{flex:0 0 auto;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;min-height:40px}
.switch.on{background:#fde68a;color:#111;border-color:#fde68a}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px;padding:12px;height:calc(100vh - var(--hh));height:calc(100dvh - var(--hh))}
#stage{position:relative;background:#f4f7fb;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);min-height:300px}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#ov{position:absolute;top:10px;right:10px;max-width:min(330px,46%);pointer-events:none}
#ov .box{background:rgba(255,255,255,.93);border-radius:12px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:14px}
#ov .bar{height:14px;border-radius:7px;margin:2px 0 8px}
#viewbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center}
#viewbar button{border:0;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.15);min-height:38px;color:var(--ink)}
#viewbar span{font-size:12px;color:var(--muted);background:rgba(255,255,255,.8);padding:4px 8px;border-radius:8px}
#panel{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:600}
@media (orientation:portrait),(max-width:900px){
  header h1 .t{display:none}
  main{display:block;height:auto;padding:10px}
  #stage{position:sticky;top:var(--hh);z-index:5;margin-bottom:10px;height:50vh}
  #panel{overflow:visible}
  #viewbar span{display:none}
}
h2{font-size:21px;margin:4px 0 6px}
h3{font-size:16px;margin:0 0 8px;color:var(--brand)}
.lead{margin:0 0 10px;color:var(--muted)}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.real{border-left:5px solid var(--warn)}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.btn{border:0;border-radius:10px;padding:10px 13px;font-size:15px;font-weight:600;background:#e2e8f0;color:var(--ink);min-height:44px}
.btn.primary{background:var(--accent);color:#fff}
.btn.on{background:#fde68a;box-shadow:inset 0 0 0 2px var(--warn)}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn:active{transform:scale(.97)}
.seg{display:inline-flex;flex-wrap:wrap;background:#e2e8f0;border-radius:10px;padding:3px;gap:3px}
.seg .btn{background:transparent;min-height:38px;padding:8px 12px}
.seg .btn.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.lbl-s{font-size:13px;color:var(--muted);margin:6px 0 4px;font-weight:600}
.msg{min-height:24px;font-size:15px;color:var(--brand);font-weight:600;padding:6px 10px;border-radius:8px;background:#eff6ff;margin-top:4px}
input[type=range]{width:100%;height:36px;accent-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin-top:6px}
th,td{border:1px solid var(--line);padding:6px;text-align:center}
th{background:#f1f5f9;font-weight:600}
td input{width:100%;border:0;font-size:14.5px;padding:4px;background:#fffbeb;border-radius:4px}
td .x{border:0;background:none;color:#b91c1c;font-size:18px;padding:2px 6px}
.chart{width:100%;height:auto;margin-top:8px}
.q{margin-bottom:12px}
.q p{margin:0 0 6px;font-weight:600}
.q .opt{display:block;width:100%;text-align:left;margin-bottom:6px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);min-height:44px}
.q .opt.right{border-color:var(--ok);background:#ecfdf5}
.q .opt.wrong{border-color:#f87171;background:#fef2f2}
.fb{font-size:14.5px;margin-top:4px}
.fb.ok{color:#065f46}.fb.no{color:#991b1b}
.jd{font-size:16px;line-height:2.4}
.jd select{font-size:16px;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:#fff;color:var(--ink);max-width:100%}
details{background:#f8fafc;border-radius:10px;padding:8px 12px;margin-top:6px}
summary{font-weight:700;color:var(--brand);padding:4px 0;cursor:pointer}
.merk{background:#fef9c3;border-radius:10px;padding:10px 12px;margin-top:8px;border-left:5px solid #eab308}
textarea{width:100%;min-height:90px;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:8px;font-family:inherit}
.small{font-size:13.5px;color:var(--muted)}
.legend{display:inline-flex;gap:12px;font-size:14px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;color:#fff;text-align:center;line-height:16px;font-weight:700;font-size:13px;vertical-align:middle}
</style>
</head>
<body>
<header id="hdr">
  <h1>⚡<span class="t"> Elektroskop-Labor</span></h1>
  <nav id="tabs"></nav>
  <button class="switch" id="chgToggle">Ladungen: aus</button>
</header>
<main>
  <section id="stage">
    <div id="ov"></div>
    <div id="viewbar"><button id="viewReset">⟲ Ansicht</button><span>Hintergrund ziehen: drehen · zwei Finger: zoomen</span></div>
    <div id="nogl">3D-Darstellung wird von diesem Browser nicht unterstützt (WebGL fehlt).</div>
  </section>
  <aside id="panel"></aside>
</main>
<script>/*@@THREE@@*/</script>
<script>
"use strict";
/* ============ Modellkonstanten (Modellkoordinaten in "px": x nach rechts, y nach unten; 100 px = 1 3D-Einheit) ============ */
const PY=250, HC=420, HR=120, PL=100, PX=20;
const KL=0.0204;        // Gleichgewicht: tan(alpha) = KL * q^2  (q = Ladung auf Metallstab+Zeiger)
const FG=20;            // Gewichtskraft des Zeigers in mN (m = 2 g)
const TH_MAX=85*Math.PI/180, PORTION=2.5, RUB=4, RODMAX=32, D0=4.5;
const W=x=>(x-500)/100, H=y=>(606-y)/100;
const RODS={
  pvc:{name:"Kunststoffstab",cloth:"Wolltuch",sign:-1,color:0x374151,glass:false},
  glas:{name:"Glasstab",cloth:"Seidentuch",sign:+1,color:0xbfe9fb,glass:true}
};
const fmt=(x,d=1)=>(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d).replace(".",",");
const deg=th=>th*180/Math.PI, skt=th=>deg(th)/9;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=s=>document.querySelector(s);
const LS={
  get(k,d){try{const v=localStorage.getItem("eskop."+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("eskop."+k,JSON.stringify(v));}catch(e){}},
  clear(){try{Object.keys(localStorage).filter(k=>k.indexOf("eskop.")===0).forEach(k=>localStorage.removeItem(k));}catch(e){}}
};

/* ============ Stationen ============ */
const JD_ADJ=["größer","kleiner"];
const STATIONS=[
{
  id:"aufbau",tab:"Start",title:"Das Elektroskop – Aufbau",
  lead:"Ein Elektroskop zeigt an, ob ein Körper elektrisch geladen ist. In diesem 3D-Labor wiederholst du die Versuche aus dem Unterricht Schritt für Schritt.",
  scene:{es:[600],labels:true,view:{x0:250,x1:960,y0:120,y1:640}},
  html:`<div class="card"><h3>So bedienst du das Labor</h3><ol class="steps">
   <li>Oben wählst du den Versuch: <b>V1 bis V8</b>, am Ende die <b>Merksätze</b>.</li>
   <li>Den <b>Stab ziehst du mit dem Finger</b>. Zum Reiben bewegst du ihn auf dem Tuch kräftig hin und her (oder tippe auf „Stab reiben“).</li>
   <li>Ziehst du auf dem <b>Hintergrund</b>, drehst du die 3D-Ansicht. Mit zwei Fingern zoomst du. „⟲ Ansicht“ stellt sie zurück.</li>
   <li>Der Knopf oben rechts schaltet die <b>Ladungsanzeige</b> um:
     <span class="legend"><span><span class="dot" style="background:var(--pos)">+</span> positiv</span><span><span class="dot" style="background:var(--neg)">−</span> negativ</span></span><br>
     <b>aus</b> → <b>Überschuss</b> (nur die Ladung, die zu viel ist) → <b>alle</b> (alle positiven und negativen Ladungen).</li>
   <li>Den Ausschlag liest du an der <b>Skala</b> ab (0 bis 10 Skalenteile, kurz Skt). Der Wert steht auch vorn am Fuß.</li>
   <li><b>„Messwert aufnehmen“</b> trägt den Wert in die Tabelle ein. Tabellen, Antworten und Notizen bleiben auf diesem iPad gespeichert.</li>
  </ol></div>
  <div class="card"><h3>Die Teile des Elektroskops</h3>
  <p style="margin:0">Teller, Metallstab und Zeiger sind aus Metall und leiten. Der Zeiger ist an einer <b>Drehachse</b> gelagert, sein Schwerpunkt liegt etwas unterhalb der Achse. Der <b>Isolator</b> trennt die leitenden Teile vom Gehäuse, damit die Ladung nicht abfließt.</p></div>`,
  qs:[
   {q:"Das Elektroskop ist ungeladen. Wie hängt der Zeiger?",o:["Senkrecht – die Gewichtskraft zieht seinen Schwerpunkt so tief wie möglich.","Schräg, weil er vom Metallstab abgestoßen wird.","Waagerecht."],c:0,
    ex:"Ohne Ladung hat nur die Gewichtskraft eine Drehwirkung. Sie dreht den Zeiger, bis der Schwerpunkt genau unter der Drehachse liegt."},
   {q:"Wozu dient der Isolator zwischen Metallstab und Gehäuse?",o:["Damit die Ladung nicht über das Gehäuse abfließen kann.","Damit der Zeiger leichter wird.","Damit man die Skala besser sieht."],c:0,
    ex:"Ein Isolator (Nichtleiter) leitet keine Ladung. So bleibt die Ladung auf Teller, Metallstab und Zeiger."}
  ],
  merk:"Ein Elektroskop besteht aus Teller, Metallstab und drehbar gelagertem Zeiger (alle leitend). Ein Isolator trennt sie vom Gehäuse. Der Ausschlag des Zeigers zeigt an, ob das Elektroskop geladen ist."
},
{
  id:"v1",tab:"V1 Ladung",title:"V1: Gibt es elektrische Ladung?",
  lead:"Durch Reiben bekommt ein Stab eine Eigenschaft, die man nicht sehen kann. Das Elektroskop macht sie sichtbar.",
  real:"Im Unterricht: Ein Kunststoffstab wurde mit einem Wolltuch gerieben und an den Teller des Elektroskops gehalten.",
  scene:{es:[620],rods:["pvc"],cloth:true,ground:true},
  steps:[
   "Ziehe den <b>ungeriebenen</b> Kunststoffstab auf den Teller (berühren) und wieder weg. Beobachte den Zeiger.",
   "Reibe den Stab auf dem Wolltuch: ziehe ihn mehrmals kräftig hin und her.",
   "Berühre mit dem geriebenen Stab den Teller und ziehe ihn wieder weg. Beobachte den Zeiger.",
   "Reibe den Stab noch einmal und berühre den Teller erneut. Was ändert sich?",
   "Tippe auf „Finger an den Teller“. Was passiert mit dem Zeiger?",
   "Wiederhole alles mit der Ladungsanzeige „Überschuss“."],
  qs:[
   {q:"Der ungeriebene Stab bewirkt nichts. Nach dem Reiben und Berühren bleibt der Zeiger ausgelenkt. Was folgt daraus?",
    o:["Der Stab ist durch das Reiben elektrisch geladen worden. Ein Teil dieser Ladung ist auf das Elektroskop übergegangen.","Der Stab ist beim Reiben warm geworden und erwärmt den Zeiger.","Der Zeiger ist beim Berühren schwerer geworden."],c:0,
    ex:"Es gibt <b>elektrische Ladung</b>. Sie geht beim Berühren teilweise auf das Elektroskop über und bleibt dort."},
   {q:"Nach dem zweiten Reiben und Berühren ist der Ausschlag…",o:["größer als vorher.","genauso groß.","wieder null."],c:0,
    ex:"Es ist mehr Ladung auf dem Elektroskop. Wie der Ausschlag von der Ladungsmenge abhängt, untersuchst du in V7."},
   {q:"Was bewirkt der Finger am Teller?",o:["Über den Körper findet ein Ladungsausgleich mit der Erde statt – das Elektroskop wird entladen.","Der Finger lädt das Elektroskop zusätzlich auf.","Der Finger hält den Zeiger fest."],c:0,
    ex:"Der menschliche Körper leitet. Über ihn gleicht sich die Ladung mit der (riesigen) Erde aus. Das nennt man <b>Erden</b>."}
  ],
  info:"Beim Reiben gehen Elektronen (winzige, negativ geladene Teilchen) vom Wolltuch auf den Kunststoffstab über. Dabei <b>entsteht keine Ladung neu</b> – sie wird nur <b>getrennt</b>: Der Stab hat danach Elektronenüberschuss (negativ), das Tuch genauso viel Elektronenmangel (positiv). Beim Berühren geht ein Teil der Ladung auf das Elektroskop über und verteilt sich auf Teller, Metallstab und Zeiger. Metallstab und Zeiger sind dann gleichnamig geladen und <b>stoßen sich ab</b> – der Zeiger schlägt aus. Beim Erden fließen die überschüssigen Elektronen über den Körper zur Erde ab.",
  merk:"Beim Reiben werden Ladungen getrennt: Körper werden elektrisch geladen. Geladene Körper üben Kräfte aufeinander aus. Das Elektroskop zeigt Ladung an. Durch Erden wird ein Körper entladen."
},
{
  id:"v2",tab:"V2 Influenz",title:"V2: Laden durch Influenz",
  lead:"Was passiert, wenn der geladene Stab dem Teller nur <b>nahe kommt</b>, ihn aber nicht berührt?",
  real:"Im Unterricht: Der geriebene Stab wurde dem Teller langsam genähert und wieder entfernt – ohne Berührung. Danach wurde das Elektroskop durch Influenz mit Erdung aufgeladen.",
  scene:{es:[620],rods:["pvc","glas"],cloth:true,ground:true,dist:true},
  steps:[
   "Reibe den Kunststoffstab am Wolltuch (etwa 5×).",
   "Nähere den Stab langsam dem Teller, <b>ohne ihn zu berühren</b>. Beobachte den Zeiger und die Abstandsanzeige d.",
   "Ziehe den Stab wieder weg. Was macht der Zeiger?",
   "Stelle die Ladungsanzeige auf „alle“ und wiederhole Schritt 2 und 3. Welche Ladungen bewegen sich – und welche nicht?",
   "<b>Aufladen durch Influenz:</b> Stab nah an den Teller halten (nicht berühren) → „Finger an den Teller“ antippen → Finger wieder wegnehmen → <i>erst dann</i> den Stab entfernen.",
   "Prüfe: Nähere den geriebenen Kunststoffstab erneut. Wird der Ausschlag größer oder kleiner?",
   "Zusatz: Wiederhole mit dem Glasstab (am Seidentuch reiben)."],
  qs:[
   {q:"Der geladene Stab ist nah am Teller, berührt ihn aber nicht. Der Zeiger schlägt aus. Warum?",
    o:["Ladung springt durch die Luft vom Stab auf das Elektroskop über.","Die frei beweglichen Elektronen im Metall werden verschoben. Oben und unten entstehen entgegengesetzte Ladungen; Metallstab und Zeiger sind gleichnamig geladen und stoßen sich ab.","Der Stab zieht den Zeiger mit seiner Gewichtskraft an."],c:1,
    ex:"Diese Ladungstrennung durch einen geladenen Körper in der Nähe heißt <b>Influenz</b>. Es wird keine Ladung vom Stab übertragen – insgesamt bleibt das Elektroskop neutral. Deshalb geht der Ausschlag zurück, wenn der Stab entfernt wird."},
   {q:"Wie hängt der Ausschlag vom Abstand des Stabs ab?",o:["Je näher der Stab, desto größer der Ausschlag.","Der Ausschlag bleibt immer gleich.","Je näher der Stab, desto kleiner der Ausschlag."],c:0,
    ex:"Das misst du genau in V8."},
   {q:"Du hast das Elektroskop mit dem negativen Kunststoffstab durch Influenz (mit Erdung) aufgeladen. Wie ist es danach geladen?",o:["negativ, wie der Stab","positiv, also entgegengesetzt zum Stab","gar nicht"],c:1,
    ex:"Beim Erden fließen die vom Stab abgestoßenen Elektronen über den Finger zur Erde ab. Nimmt man erst den Finger und dann den Stab weg, bleibt Elektronenmangel: Das Elektroskop ist <b>positiv</b>. Prüfung: Nähert man den negativen Stab, wird der Ausschlag <i>kleiner</i>."}
  ],
  info:"In Metallen gibt es <b>frei bewegliche Elektronen</b>; die positiven Ladungen (Atomrümpfe) sitzen fest. Ein negativer Stab stößt die Elektronen ab: Sie wandern nach unten in Metallstab und Zeiger (dort Elektronenüberschuss), oben im Teller bleibt Elektronenmangel. Ein positiver Stab zieht die Elektronen dagegen nach oben in den Teller. Diese <b>Ladungstrennung</b> durch einen geladenen Körper in der Nähe heißt <b>Influenz</b>. Dabei geht keine Ladung vom Stab auf das Elektroskop über. Erdet man währenddessen, fließen Elektronen zur Erde ab (negativer Stab) bzw. von der Erde zu (positiver Stab). Nimmt man danach zuerst den Finger und dann den Stab weg, ist das Elektroskop <b>entgegengesetzt</b> zum Stab geladen.",
  merk:"Influenz: Ein geladener Körper trennt in einem Leiter die Ladungen, ohne ihn zu berühren – es wird dabei keine Ladung übertragen. Erdet man währenddessen, fließen Elektronen zur Erde ab oder von ihr zu: So lädt man ein Elektroskop durch Influenz, und zwar entgegengesetzt zum Stab."
},
{
  id:"v3",tab:"V3 Kontakt",title:"V3: Ladungsübertragung durch Kontakt",
  lead:"Ladung kann durch Berühren übertragen werden – vom Stab auf ein Elektroskop und von einem Elektroskop auf ein anderes.",
  real:"Im Unterricht: Zwei Elektroskope. Eines wurde mit dem geriebenen Stab durch Berühren geladen, dann wurden beide mit einem Bügel verbunden.",
  scene:{es:[470,790],rods:["pvc","glas"],cloth:true,ground:true,bridge:true},
  steps:[
   "Reibe den Stab und berühre damit den Teller von E1. Entferne den Stab: Der Ausschlag bleibt!",
   "Vergleiche mit V2: Was ist der Unterschied zwischen Influenz und Berührung?",
   "Nimm einen Messwert auf und schreibe unter „Situation“, was du gemacht hast.",
   "Verbinde E1 und E2 mit dem <b>Kunststoffbügel</b>. Beobachte. Nimm den Bügel wieder ab.",
   "Verbinde E1 und E2 mit dem <b>Metallbügel</b>. Beobachte beide Zeiger und nimm einen Messwert auf.",
   "Nimm den Bügel ab. Bleiben die Ausschläge?"],
  table:{cols:[{k:"sit",l:"Situation",edit:true},{k:"e1",l:"E1 in Skt",d:1},{k:"e2",l:"E2 in Skt",d:1}],rec:r=>({sit:"",e1:skt(r.es[0].th),e2:skt(r.es[1].th)})},
  qs:[
   {q:"Nach dem Berühren und Entfernen des Stabs bleibt der Ausschlag. Warum?",o:["Ladung ist vom Stab auf das Elektroskop übergegangen und bleibt dort.","Der Zeiger klemmt.","Der Stab wirkt aus der Entfernung weiter."],c:0,
    ex:"Anders als bei der Influenz ist hier wirklich Ladung übertragen worden."},
   {q:"Mit dem Metallbügel zeigen danach beide Elektroskope den gleichen, kleineren Ausschlag. Was bedeutet das?",o:["Die Ladung hat sich auf beide Elektroskope verteilt.","Ein Teil der Ladung wurde vernichtet.","Es ist neue Ladung entstanden."],c:0,
    ex:"Über den Leiter fließen Elektronen, bis beide gleich geladen sind. Die Gesamtladung bleibt erhalten – sie ist nur verteilt."},
   {q:"Mit dem Kunststoffbügel passiert nichts. Warum?",o:["Kunststoff ist ein Isolator (Nichtleiter).","Der Bügel ist zu kurz.","Kunststoff ist ein guter Leiter."],c:0,
    ex:"Metalle sind Leiter, Kunststoff und Glas sind Isolatoren."}
  ],
  info:"Berührt der geladene Stab den Teller, gehen Elektronen über (vom negativen Stab aufs Elektroskop bzw. vom Elektroskop auf den positiven Stab). Die Ladung verteilt sich auf alle leitenden Teile. Verbindet man zwei Elektroskope mit einem <b>Leiter</b> (Metall), verteilt sie sich auf beide, die Gesamtladung bleibt gleich. Ein <b>Isolator</b> (Kunststoff) leitet keine Ladung. Weil Kunststoff- und Glasstäbe selbst Isolatoren sind, gibt der Stab nur Ladung von der Berührungsstelle ab – deshalb kann man mehrmals nacheinander Ladung übertragen.",
  merk:"Kontakt: Berührt ein geladener Körper einen Leiter, geht Ladung über und bleibt dort. Über Leiter verteilt sich Ladung, Isolatoren leiten sie nicht. Die Gesamtladung bleibt erhalten."
},
{
  id:"v4",tab:"V4 Kräfte",title:"V4: Kräftegleichgewicht am Zeiger",
  lead:"Warum bleibt der Zeiger schräg stehen? Die Pfeile zeigen die Kräfte am Zeiger, die Balken oben rechts ihre Drehwirkung.",
  real:"Im Unterricht: Wir haben verglichen, wie der Zeiger ungeladen (nur Gewichtskraft) und geladen (Gewichtskraft und elektrische Kraft) im Gleichgewicht ist.",
  scene:{es:[420],forces:true,charge:true,view:{x0:150,x1:900,y0:170,y1:640}},
  steps:[

/* ============ Laufzeitzustand ============ */
let cur=null,curIdx=0,chargeMode=0;
const cache={};
const panel=$("#panel"), stage=$("#stage"), ov=$("#ov");

function makeRuntime(cfg){
  const sc=cfg.scene;
  const r={cfg,sc,
    es:(sc.es||[]).map(cx=>({cx,Q:0,th:0,om:0,grounded:false,qs:0,low:0,d:99,contact:false,finger:0,kq:0})),
    rods:{pvc:{Q:0},glas:{Q:0}},clothQ:{pvc:0,glas:0},rodType:(sc.rods&&sc.rods[0])||null,
    tip:{x:135,y:440},rubAcc:0,rubs:0,bridge:null,elOff:false,lamp:null,anim:null,n:0,srcSign:1,sign:1,wrap:false,msg:""};
  if(sc.slider){r.rods.pvc.Q=-24;r.rubs=6;r.tip={x:sc.es[0],y:PY-10*PX};}
  return r;
}

/* ============ Physik (unverändert im Modell, Koordinaten in px) ============ */
function plateDist(t,cx){const dx=Math.max(cx-60-t.x,0,t.x-(cx+60)),dy=Math.max(PY-t.y,0,t.y-(PY+12));return Math.hypot(dx,dy);}
function constrainTip(t,prev){
  const r=cur;
  t.x=clamp(t.x,20,980); t.y=clamp(t.y,50,600);
  if(r.sc.cloth&&!r.wrap&&t.x>20&&t.x<250) t.y=Math.min(t.y,580);
  r.es.forEach(e=>{
    if(Math.abs(t.x-e.cx)<HR+14&&t.y>PY){
      if(prev.y<=PY+0.5) t.y=PY; else t.x=t.x<e.cx?e.cx-HR-14:e.cx+HR+14;
    }
  });
  return t;
}
function curRod(){return cur.rodType?cur.rods[cur.rodType]:null;}
function rodEff(){const rod=curRod();if(!rod)return 0;return rod.Q+(cur.wrap?cur.clothQ[cur.rodType]:0);}
function rub(){
  const r=cur,R=RODS[r.rodType],rod=curRod();if(!rod)return;
  if(Math.abs(rod.Q)>=RODMAX){setMsg(`${R.name} ist schon stark geladen.`);return;}
  rod.Q=clamp(rod.Q+R.sign*RUB,-RODMAX,RODMAX);
  r.clothQ[r.rodType]=clamp(r.clothQ[r.rodType]-R.sign*RUB,-RODMAX,RODMAX);
  r.rubs++;
  setMsg(r.wrap?`Stab im Tuch gerieben (${r.rubs}×).`:`${R.name} am ${R.cloth} gerieben (${r.rubs}×).`);
  const ri=$("#rubInfo");if(ri)ri.textContent=`Stab gerieben: ${r.rubs}×`;
}
function step(dt){
  const r=cur;if(!r)return;
  const rod=curRod(),qr=rodEff();
  r.es.forEach((e,i)=>{
    if(rod){e.d=plateDist(r.tip,e.cx)/PX;e.qs=qr*0.7/(1+Math.pow(e.d/D0,2));}else{e.d=99;e.qs=0;}
    const touch=rod&&e.d*PX<=0.6;
    if(touch&&!e.contact){
      if(r.wrap) setMsg("Stab mit Tuch berührt den Teller: Zusammen sind Stab und Tuch neutral – es geht keine Ladung über.");
      else if(Math.abs(rod.Q)>0.3){const dq=0.4*rod.Q;e.Q+=dq;rod.Q-=dq;setMsg(`Berührung: Ladung vom ${RODS[r.rodType].name} auf E${i+1} übertragen.`);}
      else setMsg("Berührung – aber der Stab ist nicht geladen.");
    }
    e.contact=touch;
    if(e.finger>0)e.finger-=dt;
  });
  if(r.bridge==="metal"&&r.es.length===2){
    const[a,b]=r.es;
    if(a.grounded||b.grounded){a.Q=b.Q=-(a.qs+b.qs)/(2*0.7);}else{const m=(a.Q+b.Q)/2;a.Q=b.Q=m;}
  }else r.es.forEach(e=>{if(e.grounded)e.Q=-e.qs/0.7;});
  if(r.lamp){const e=r.es[r.lamp.i];r.lamp.t+=dt;e.Q*=Math.exp(-dt*2.5);if(r.lamp.t>1.8){e.Q=0;r.lamp=null;}}
  if(r.anim){const A=r.anim;A.t+=dt;const p=A.t/A.dur;
    if(p>=0.5&&!A.done){A.done=true;r.es[0].Q+=r.srcSign*PORTION;r.n++;setMsg(`Ladungsportion ${r.n} übertragen.`);const ni=$("#nInfo");if(ni)ni.textContent=`Übertragene Portionen: ${r.n}`;}
    if(p>=1)r.anim=null;}
  r.es.forEach(e=>{
    e.low=0.7*e.Q+e.qs;
    e.kq=r.elOff?0:KL*e.low*e.low;
    const sub=6,h=dt/sub;
    for(let k=0;k<sub;k++){
      const acc=42*(e.kq*Math.cos(e.th)-Math.sin(e.th))-4.2*e.om;
      e.om+=acc*h;e.th+=e.om*h;
      if(e.th<0){e.th=0;if(e.om<0)e.om=-e.om*0.15;}
      if(e.th>TH_MAX){e.th=TH_MAX;if(e.om>0)e.om=0;}
    }
  });
}

/* Ladungssymbole: Positionen in Weltkoordinaten */
function regionSyms(L,q,per,B,pos,maxEx){
  if(chargeMode===1){const n=Math.min(maxEx,Math.round(Math.abs(q)/per));for(let i=0;i<n;i++)L.push([...pos(i,n,false),Math.sign(q)]);}
  else if(chargeMode===2){const ne=clamp(B-Math.round(q/per),0,2*B),tot=Math.max(B,ne);
    for(let i=0;i<B;i++)L.push([...pos(i,tot,false),1]);for(let i=0;i<ne;i++)L.push([...pos(i,tot,true),-1]);}
}
function chargeList(){
  const r=cur,L=[];if(!chargeMode)return L;
  r.es.forEach(e=>{
    const X=W(e.cx),qp=0.3*e.Q-e.qs;
    regionSyms(L,qp,2,4,(i,n,alt)=>[X-.48+.96*(i+.5)/n+(alt?.05:0),H(PY)+.1+(alt?.15:0),.45],6);
    const s=Math.sin(e.th),c=Math.cos(e.th),yC=H(HC);
    regionSyms(L,e.low,2,6,(i,n,alt)=>{
      const ns=Math.ceil(n/2);
      if(i<ns){const y=H(PY+45)-(i+.5)*((H(PY+45)-H(HC+55))/ns);return[X-.15-(alt?.13:0),y,.2];}
      const k=i-ns,up=k%2===0,rad=.32+Math.floor(k/2)*.17,sg=up?1:-1,off=(up?1:-1)*(alt?.2:.1);
      return[X+sg*rad*s+off*c,yC+sg*rad*c-off*s,.2];
    },14);
  });
  const rod=curRod();
  if(rod&&R.rod){const X=W(r.tip.x),Y=H(r.tip.y);
    regionSyms(L,rod.Q,chargeMode===2?4:3,8,(i,n,alt)=>[X+(chargeMode===2?(alt?.07:-.07):0),Y+.12+i*(1.75/Math.max(n,9)),.16],11);
    const q=r.clothQ[r.rodType];
    if(r.wrap)regionSyms(L,q,4,8,(i,n,alt)=>[X+((i%2)?.17:-.17)+(alt?.06:0),Y+.2+Math.floor(i/2)*.22+(alt?.1:0),.26],8);
    else if(R.cloth)regionSyms(L,q,4,8,(i,n,alt)=>[W(135)-.85+(i%8)*.24+(alt?.09:0),.26,.55-(alt?.1:0)-Math.floor(i/8)*.25],8);
  }
  if(r.sc.spoon){const sx=W(190),sy=H(300);
    if(chargeMode===1)for(let k=0;k<10;k++){const a=k/10*2*Math.PI;L.push([sx+.45*Math.cos(a),sy+.45*Math.sin(a),.35,r.srcSign]);}
    else if(chargeMode===2){for(let k=0;k<8;k++){const a=k/8*2*Math.PI;L.push([sx+.42*Math.cos(a),sy+.42*Math.sin(a),.4,1]);if(r.srcSign<0||k%2)L.push([sx+.42*Math.cos(a+.25),sy+.42*Math.sin(a+.25),.45,-1]);}
      if(r.srcSign<0)for(let k=0;k<4;k++){const a=k/4*2*Math.PI+.4;L.push([sx+.22*Math.cos(a),sy+.22*Math.sin(a),.5,-1]);}}
    if(r.anim&&r.anim.t/r.anim.dur<0.5&&R.spoon)L.push([R.spoon.position.x,R.spoon.position.y,.2,r.srcSign]);
  }
  return L;
}

function render3D(){
  if(!renderer)return;
  const r=cur,sc=r.sc,rod=curRod();
  r.es.forEach((e,i)=>{const o=R.es[i];o.ptr.rotation.z=-e.th;o.fing.visible=e.grounded||e.finger>0;o.rd.set(`E${i+1}: ${fmt(skt(e.th))} Skt`);});
  if(R.rod){R.rod.g.position.set(W(r.tip.x),H(r.tip.y),0);R.rod.sleeve.visible=r.wrap;if(R.cloth){R.cloth.visible=!r.wrap;R.clothL.visible=!r.wrap;}}
  const L=chargeList();
  for(let i=0;i<chgPool.length;i++){const s=chgPool[i];if(i<L.length){const p=L[i];s.visible=true;s.position.set(p[0],p[1],p[2]);const tx=p[3]>0?R.texP:R.texM;if(s.material.map!==tx){s.material.map=tx;s.material.needsUpdate=true;}}else s.visible=false;}
  if(R.dist){
    const e=rod?r.es.reduce((a,b)=>a.d<b.d?a:b):null;
    if(e&&e.d<30&&e.d*PX>1){const px=clamp(r.tip.x,e.cx-60,e.cx+60),a=new THREE.Vector3(W(r.tip.x),H(r.tip.y),.15),b=new THREE.Vector3(W(px),H(PY),.15);
      R.dist.geometry.setFromPoints([a,b]);R.dist.computeLineDistances();R.dist.visible=true;R.distL.visible=true;R.distL.set(`d = ${fmt(e.d)} cm`);R.distL.position.set((a.x+b.x)/2+.65,(a.y+b.y)/2,.2);}
    else{R.dist.visible=false;R.distL.visible=false;}
  }
  if(R.brMetal){R.brMetal.visible=r.bridge==="metal";R.brIso.visible=r.bridge==="iso";}
  if(R.lamp){const L2=R.lamp;if(r.lamp){L2.g.visible=true;L2.g.position.x=W(r.es[r.lamp.i].cx);L2.gl.position.y=L2.y0+(r.lamp.neg?.3:.95);L2.gl.material.opacity=Math.max(0,1-r.lamp.t/1.8);}else L2.g.visible=false;}
  if(R.spoon){
    R.srcL.set(r.srcSign>0?"Kugel (positiv geladen)":"Kugel (negativ geladen)");
    const rest={x:W(190+55+14),y:H(300)},tgt={x:W(r.es[0].cx),y:H(PY)+.2};let x=rest.x,y=rest.y;
    if(r.anim){const p=r.anim.t/r.anim.dur,s=p<.5?p/.5:(1-p)/.5,ee=s*s*(3-2*s);x=rest.x+(tgt.x-rest.x)*ee;y=rest.y+(tgt.y-rest.y)*ee+.9*Math.sin(Math.PI*ee);}
    R.spoon.position.set(x,y,0);
  }
  if(R.aG){
    const e=r.es[0],th=e.th,s=Math.sin(th),c=Math.cos(th),X=W(e.cx),Y=H(HC),z=.3,arm=.6;
    const S=new THREE.Vector3(X-arm*s,Y-arm*c,z),A=new THREE.Vector3(X+arm*s,Y+arm*c,z);
    const Fel=FG*e.kq,lg=FG*.045,le=Math.min(Fel*.045,2.4);
    setArrow(R.aG,R.sG,S,new THREE.Vector3(0,-1,0),lg);R.lG.position.set(S.x-.28,S.y-lg-.1,z);
    R.dS.position.copy(S);R.lS.position.set(S.x-.2,S.y+.08,z);
    const vis=Fel>0.2;R.aE.visible=R.sE.visible=R.lE.visible=vis;
    if(vis){setArrow(R.aE,R.sE,A,new THREE.Vector3(1,0,0),le);R.lE.position.set(A.x+le/2,A.y+.22,z);}
    const Tel=Fel*c,TG=FG*s,rest=Math.abs(e.om)<.03&&Math.abs(Tel-TG)<.4;
    const key=[fmt(deg(th),0),fmt(Fel,1),Math.round(Tel*4),Math.round(TG*4),rest,r.elOff].join("|");
    if(key!==R.ovKey){R.ovKey=key;
      ov.innerHTML=`<div class="box"><b>Kräfte am Zeiger</b><br>α = ${fmt(deg(th),0)}° · F<sub>G</sub> = 20 mN · F<sub>el</sub> = ${fmt(Fel,1)} mN
       <div style="margin-top:6px;color:#7c3aed;font-weight:600">Drehwirkung der elektrischen Kraft</div><div class="bar" style="background:#ede9fe"><div class="bar" style="margin:0;width:${Math.min(100,Tel*5)}%;background:#7c3aed"></div></div>
       <div style="color:#059669;font-weight:600">Drehwirkung der Gewichtskraft</div><div class="bar" style="background:#d1fae5"><div class="bar" style="margin:0;width:${Math.min(100,TG*5)}%;background:#059669"></div></div>
       <div style="font-weight:700;color:${rest?"#059669":"#d97706"}">${rest?"✓ Gleichgewicht – der Zeiger ruht":"Kein Gleichgewicht – der Zeiger dreht sich"}</div>
       ${r.elOff?'<div style="color:#b91c1c;font-weight:600;margin-top:4px">Gedankenexperiment: ohne elektrische Kraft</div>':""}</div>`;}
  }
  if(sc.neutral){
    const st=q=>Math.abs(q)<0.6?'<span style="color:#059669">neutral</span>':q<0?'<span style="color:#2563eb">negativ (Elektronenüberschuss)</span>':'<span style="color:#dc2626">positiv (Elektronenmangel)</span>';
    const rq=rod?rod.Q:0,cq=r.clothQ.pvc,e=r.es[0];
    const infl=Math.abs(e.Q)<0.6&&Math.abs(e.qs)>1.5;const key=[st(rq),st(cq),st(rq+cq),st(e.Q),r.wrap,infl].join("|");
    if(key!==R.ovKey){R.ovKey=key;ov.innerHTML=`<div class="box"><b>Ladungszustand</b><br>Stab: ${st(rq)}<br>Tuch: ${st(cq)}<br>${r.wrap?"Stab + Tuch zusammen: "+st(rq+cq)+"<br>":""}Elektroskop: ${st(e.Q)}${infl?" – aber Ladungen verschoben (Influenz)":""}</div>`;}
  }
  renderer.render(scene,camera);
}
function setArrow(a,shaft,o,dir,len){
  a.position.copy(o);a.setDirection(dir);a.setLength(Math.max(len,.2),.18,.12);a.line.visible=false;
  const L=Math.max(len-.18,.02);shaft.scale.set(1,L,1);shaft.position.copy(o).addScaledVector(dir,L/2);
  shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
}

/* ============ Touch-Bedienung ============ */
const ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);
let drag=null,orbit=null;const pts=new Map();
function ndc(ev){const b=renderer.domElement.getBoundingClientRect();return new THREE.Vector2(((ev.clientX-b.left)/b.width)*2-1,-((ev.clientY-b.top)/b.height)*2+1);}
function planePx(ev){ray.setFromCamera(ndc(ev),camera);const p=new THREE.Vector3();if(!ray.ray.intersectPlane(plane,p))return null;return{x:p.x*100+500,y:606-p.y*100};}
function bindPointer(){
  const el=renderer.domElement;
  el.addEventListener("pointerdown",ev=>{
    ev.preventDefault();pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    try{el.setPointerCapture(ev.pointerId);}catch(e){}
    if(pts.size===2){drag=null;const a=[...pts.values()];orbit={pinch:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom0:cam.zoom};return;}
    if(R.rod){ray.setFromCamera(ndc(ev),camera);if(ray.intersectObject(R.rod.hit,false).length){const p=planePx(ev);if(p){drag={id:ev.pointerId,ox:p.x-cur.tip.x,oy:p.y-cur.tip.y,lx:cur.tip.x,ly:cur.tip.y};return;}}}
    orbit={id:ev.pointerId,x:ev.clientX,y:ev.clientY};
  });
  el.addEventListener("pointermove",ev=>{
    if(!pts.has(ev.pointerId))return;ev.preventDefault();pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(orbit&&orbit.pinch&&pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);cam.zoom=clamp(orbit.zoom0*orbit.pinch/Math.max(d,1),.45,1.8);applyCam();return;}
    if(drag&&ev.pointerId===drag.id){
      const p=planePx(ev);if(!p)return;const r=cur;
      if(r.sc.slider){let d=clamp((PY-(p.y-drag.oy))/PX,1,10);d=Math.round(d*2)/2;setDist(d);return;}
      const t=constrainTip({x:p.x-drag.ox,y:p.y-drag.oy},r.tip);
      if(r.sc.cloth&&!r.wrap&&t.x>20&&t.x<250&&t.y>505){r.rubAcc+=Math.hypot(t.x-drag.lx,t.y-drag.ly);if(r.rubAcc>110){r.rubAcc=0;rub();}}
      drag.lx=t.x;drag.ly=t.y;r.tip=t;return;
    }
    if(orbit&&orbit.id===ev.pointerId){cam.yaw=clamp(cam.yaw-(ev.clientX-orbit.x)*.006,-1.0,1.0);cam.pitch=clamp(cam.pitch+(ev.clientY-orbit.y)*.004,-.05,.75);orbit.x=ev.clientX;orbit.y=ev.clientY;applyCam();}
  });
  const end=ev=>{pts.delete(ev.pointerId);if(drag&&drag.id===ev.pointerId)drag=null;if(orbit&&(orbit.id===ev.pointerId||orbit.pinch))orbit=null;};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("wheel",ev=>{ev.preventDefault();cam.zoom=clamp(cam.zoom*(1+ev.deltaY*.001),.45,1.8);applyCam();},{passive:false});
}
$("#viewReset").addEventListener("click",()=>{cam.yaw=-0.32;cam.pitch=0.2;cam.zoom=1;applyCam();});
function setDist(d){const r=cur;r.tip={x:r.es[0].cx,y:PY-d*PX};const sl=$("#dSlider"),lb=$("#dVal");if(sl&&+sl.value!==d)sl.value=d;if(lb)lb.textContent=fmt(d)+" cm";}

/* ============ Panel ============ */
function controlsHTML(cfg){
  const sc=cfg.scene,r=cur;let h="";
  if(sc.rods&&sc.rods.length>1)h+=`<div class="lbl-s">Stab wählen</div><div class="seg" style="margin-bottom:8px">${sc.rods.map(k=>`<button class="btn ${r.rodType===k?"on":""}" data-act="rod:${k}">${RODS[k].name}</button>`).join("")}</div>`;
  if(sc.rods&&sc.rods.length)h+=`<div class="btns"><button class="btn primary" data-act="rub">Stab reiben</button><button class="btn" data-act="rodreset">Stab entladen</button>${sc.slider?"":`<button class="btn" data-act="rodhome">Stab zur Seite</button>`}</div>`;
  if(sc.wrap)h+=`<div class="btns"><button class="btn ${r.wrap?"on":""}" data-act="wrap">${r.wrap?"Tuch abnehmen":"Tuch um den Stab wickeln"}</button></div>`;
  if(sc.slider)h+=`<div class="lbl-s">Abstand Stab – Teller: <span id="dVal">${fmt((PY-r.tip.y)/PX)} cm</span></div><input id="dSlider" type="range" min="1" max="10" step="0.5" value="${(PY-r.tip.y)/PX}"><div class="small" id="rubInfo">Stab gerieben: ${r.rubs}×</div>`;
  if(sc.ground)h+=`<div class="lbl-s">Erdung</div><div class="btns">${r.es.map((e,i)=>`<button class="btn ${e.grounded?"on":""}" data-act="ground:${i}">${e.grounded?"Finger weg von":"Finger an den Teller"}${r.es.length>1?" E"+(i+1):""}</button>`).join("")}</div>`;
  if(sc.pm)h+=`<div class="lbl-s">Ladungsportion auf das Elektroskop</div><div class="btns"><button class="btn" data-act="addq:1">+ positive Portion</button><button class="btn" data-act="addq:-1">− negative Portion</button><button class="btn" data-act="discharge">Entladen</button></div>`;
  if(sc.bridge)h+=`<div class="lbl-s">E1 und E2 verbinden</div><div class="seg" style="margin-bottom:8px"><button class="btn ${r.bridge===null?"on":""}" data-act="bridge:none">kein Bügel</button><button class="btn ${r.bridge==="iso"?"on":""}" data-act="bridge:iso">Kunststoffbügel</button><button class="btn ${r.bridge==="metal"?"on":""}" data-act="bridge:metal">Metallbügel</button></div>`;
  if(sc.lamp)h+=`<div class="lbl-s">Ladungsart prüfen</div><div class="btns">${r.es.map((e,i)=>`<button class="btn" data-act="lamp:${i}">Glimmlampe an E${i+1}</button>`).join("")}</div>`;
  if(sc.spoon)h+=`<div class="lbl-s">Ladung der Kugel</div><div class="seg" style="margin-bottom:8px"><button class="btn ${r.srcSign>0?"on":""}" data-act="src:1">positiv (+)</button><button class="btn ${r.srcSign<0?"on":""}" data-act="src:-1">negativ (−)</button></div>
     <div class="btns"><button class="btn primary" data-act="spoon">Ladungsportion übertragen</button><button class="btn" data-act="discharge">Entladen (Finger)</button></div><div class="small" id="nInfo">Übertragene Portionen: ${r.n}</div>`;
  if(sc.charge)h+=`<div class="lbl-s">Ladungsart</div><div class="seg" style="margin-bottom:8px"><button class="btn ${r.sign>0?"on":""}" data-act="sign:1">positiv (+)</button><button class="btn ${r.sign<0?"on":""}" data-act="sign:-1">negativ (−)</button></div>
     <div class="btns"><button class="btn primary" data-act="addq">Ladungsportion hinzufügen</button><button class="btn" data-act="discharge">Entladen (Finger)</button></div>
     <div class="btns"><button class="btn ${r.elOff?"on":""}" data-act="eloff">${r.elOff?"Elektrische Kraft wieder zulassen":"Elektrische Kraft wegdenken"}</button></div><div class="small" id="nInfo">Ladungsportionen: ${r.n}</div>`;
  h+=`<div class="btns" style="margin-top:6px"><button class="btn danger" data-act="reset">Versuch zurücksetzen</button></div><div class="msg" id="msg">${r.msg||"&nbsp;"}</div>`;
  return h;
}
function buildPanel(){
  const cfg=cur.cfg;let h=`<h2>${cfg.title}</h2><p class="lead">${cfg.lead}</p>`;
  if(cfg.summary){panel.innerHTML=h+summaryHTML();return;}
  if(cfg.real)h+=`<div class="card real"><b>Bezug zum Unterricht</b><br>${cfg.real}</div>`;
  if(cfg.html)h+=cfg.html;
  if(cfg.steps)h+=`<div class="card"><h3>Versuchsanleitung</h3><ol class="steps">${cfg.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`;
  if(cfg.scene.rods||cfg.scene.spoon||cfg.scene.charge)h+=`<div class="card" id="ctrl">${controlsHTML(cfg)}</div>`;
  if(cfg.table)h+=`<div class="card"><h3>Messtabelle</h3><div class="btns"><button class="btn primary" data-act="record">Messwert aufnehmen</button><button class="btn danger" data-act="clearrows">Tabelle leeren</button></div><div id="tbl"></div></div>`;
  if(cfg.qs)h+=`<div class="card"><h3>Beobachten und erklären</h3>${cfg.qs.map((q,qi)=>`<div class="q" data-qi="${qi}"><p>${qi+1}. ${q.q}</p>${q.o.map((o,oi)=>`<button class="opt" data-act="ans:${qi}:${oi}">${o}</button>`).join("")}<div class="fb"></div></div>`).join("")}</div>`;
  if(cfg.jd)h+=`<div class="card"><h3>Je-desto-Satz bilden</h3><p class="small" style="margin-top:0">Nutze deine Messtabelle und das Diagramm.</p>${cfg.jd.map((j,ji)=>jdHTML(cfg,j,ji)).join("")}</div>`;
  if(cfg.info)h+=`<div class="card"><details><summary>Erklärung (erst nach dem Versuch öffnen)</summary><p>${cfg.info}</p></details>${cfg.merk?`<details><summary>Merksatz</summary><div class="merk">${cfg.merk}</div></details>`:""}</div>`;
  else if(cfg.merk)h+=`<div class="card"><details><summary>Merksatz</summary><div class="merk">${cfg.merk}</div></details></div>`;
  h+=`<div class="card"><h3>Meine Notizen</h3><textarea id="notes" placeholder="Beobachtungen, Erklärungen, Fragen …">${esc(LS.get("notes."+cfg.id,""))}</textarea></div>`;
  panel.innerHTML=h;
  if(cfg.table)renderTable();
  restoreAnswers();
  const ta=$("#notes");if(ta)ta.addEventListener("input",()=>LS.set("notes."+cfg.id,ta.value));
  bindSlider();
}
function bindSlider(){const sl=$("#dSlider");if(sl)sl.addEventListener("input",()=>setDist(+sl.value));}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function refreshControls(){const c=$("#ctrl");if(c){c.innerHTML=controlsHTML(cur.cfg);bindSlider();}}
function setMsg(t){cur.msg=t;const m=$("#msg");if(m)m.textContent=t;}
function jdHTML(cfg,j,ji){
  const saved=LS.get(`jd.${cfg.id}.${ji}`,null);
  const sel=(p,opts)=>`<select data-p="${p}"><option value="">…</option>${opts.map(o=>`<option ${saved&&saved.v[p]===o?"selected":""}>${o}</option>`).join("")}</select>`;
  return `<div class="jd" data-ji="${ji}" style="margin-bottom:10px">Je ${sel(0,JD_ADJ)} ${sel(1,j.qty)}, desto ${sel(2,JD_ADJ)} ${sel(3,j.res)}. <button class="btn" data-act="jd:${ji}" style="margin-left:4px">Prüfen</button><div class="fb ${saved&&saved.ok?"ok":""}">${saved&&saved.ok?"✓ Richtig! "+j.hint:""}</div></div>`;
}
function checkJD(ji){
  const cfg=cur.cfg,j=cfg.jd[ji],box=panel.querySelector(`.jd[data-ji="${ji}"]`),fb=box.querySelector(".fb");
  const v=[...box.querySelectorAll("select")].map(s=>s.value);
  if(v.some(x=>!x)){fb.className="fb no";fb.textContent="Fülle zuerst alle Lücken aus.";return;}
  const rel=v[0]===v[2]?1:-1,match=j.ok.find(o=>o.q===v[1]&&o.r.includes(v[3]));let ok=false;
  if(!match){fb.className="fb no";fb.textContent=(v[1]==="die Masse des Zeigers"||v[3]==="die Gewichtskraft"||v[1]==="die Gewichtskraft")?"Diese Größe hast du im Versuch nicht verändert bzw. sie ändert sich nicht. Welche Größe hast du verändert, welche beobachtet?":"Diese Kombination passt nicht zu diesem Satz. Welche Größe hast du hier verändert?";}
  else if(match.rel!==rel){fb.className="fb no";fb.textContent="Die Größen stimmen, aber die Richtung nicht. Schau in deine Tabelle: Was passiert mit dem Ausschlag, wenn die Größe wächst?";}
  else{ok=true;fb.className="fb ok";fb.textContent="✓ Richtig! "+j.hint;}
  LS.set(`jd.${cfg.id}.${ji}`,{v,ok,text:`Je ${v[0]} ${v[1]}, desto ${v[2]} ${v[3]}.`});
}
function answer(qi,oi){
  const q=cur.cfg.qs[qi],box=panel.querySelector(`.q[data-qi="${qi}"]`),fb=box.querySelector(".fb"),btn=box.querySelectorAll(".opt")[oi];
  if(oi===q.c){box.querySelectorAll(".opt").forEach(b=>b.classList.remove("wrong"));btn.classList.add("right");fb.className="fb ok";fb.innerHTML="✓ Richtig! "+(q.ex||"");const a=LS.get("ans."+cur.cfg.id,{});a[qi]=oi;LS.set("ans."+cur.cfg.id,a);}
  else{btn.classList.add("wrong");fb.className="fb no";fb.textContent="Leider nicht. Beobachte den Versuch noch einmal genau und versuche es erneut.";}
}
function restoreAnswers(){
  const a=LS.get("ans."+cur.cfg.id,{});Object.keys(a).forEach(qi=>{const q=cur.cfg.qs&&cur.cfg.qs[qi];if(!q)return;const box=panel.querySelector(`.q[data-qi="${qi}"]`);if(!box)return;
    box.querySelectorAll(".opt")[q.c].classList.add("right");const fb=box.querySelector(".fb");fb.className="fb ok";fb.innerHTML="✓ Richtig! "+(q.ex||"");});
}
function rowsOf(id){return LS.get("rows."+id,[]);}
function renderTable(){
  const cfg=cur.cfg,T=cfg.table,rows=rowsOf(cfg.id),el=$("#tbl");
  let h=`<table><thead><tr><th>Nr.</th>${T.cols.map(c=>`<th>${c.l}</th>`).join("")}<th></th></tr></thead><tbody>`;
  if(!rows.length)h+=`<tr><td colspan="${T.cols.length+2}" class="small">Noch keine Messwerte.</td></tr>`;
  rows.forEach((row,i)=>{h+=`<tr><td>${i+1}</td>${T.cols.map(c=>c.edit?`<td><input data-row="${i}" data-k="${c.k}" value="${esc(row[c.k]||"")}" placeholder="…"></td>`:`<td>${fmt(row[c.k],c.d)}</td>`).join("")}<td><button class="x" data-act="delrow:${i}" aria-label="Zeile löschen">×</button></td></tr>`;});
  h+=`</tbody></table>`;if(T.x&&rows.length)h+=chartSVG(rows,T);el.innerHTML=h;
  el.querySelectorAll("input[data-row]").forEach(inp=>inp.addEventListener("input",()=>{const rs=rowsOf(cfg.id);rs[+inp.dataset.row][inp.dataset.k]=inp.value;LS.set("rows."+cfg.id,rs);}));
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p;}
function chartSVG(rows,T){
  const Wd=360,Hd=240,L=46,B=40,Rr=12,Tt=12,xs=rows.map(r=>r[T.x]),ys=rows.map(r=>r[T.y]);
  const xm=niceMax(Math.max(...xs)*1.05),ym=niceMax(Math.max(...ys)*1.05),X=v=>L+(Wd-L-Rr)*v/xm,Y=v=>Hd-B-(Hd-B-Tt)*v/ym;
  let g=`<svg class="chart" viewBox="0 0 ${Wd} ${Hd}"><rect width="${Wd}" height="${Hd}" fill="#fff"/>`;
  for(let k=0;k<=5;k++){const xv=xm*k/5,yv=ym*k/5;
    g+=`<line x1="${X(xv)}" y1="${Tt}" x2="${X(xv)}" y2="${Hd-B}" stroke="#eef2f7"/><line x1="${L}" y1="${Y(yv)}" x2="${Wd-Rr}" y2="${Y(yv)}" stroke="#eef2f7"/>`;
    g+=`<text x="${X(xv)}" y="${Hd-B+16}" font-size="11" text-anchor="middle" fill="#475569">${fmt(xv,xm<5?1:0)}</text><text x="${L-6}" y="${Y(yv)+4}" font-size="11" text-anchor="end" fill="#475569">${fmt(yv,ym<5?1:0)}</text>`;}
  g+=`<line x1="${L}" y1="${Hd-B}" x2="${Wd-Rr}" y2="${Hd-B}" stroke="#334155" stroke-width="1.5"/><line x1="${L}" y1="${Tt}" x2="${L}" y2="${Hd-B}" stroke="#334155" stroke-width="1.5"/>`;
  g+=`<text x="${(L+Wd-Rr)/2}" y="${Hd-6}" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="600">${T.xl}</text><text transform="translate(13,${(Tt+Hd-B)/2}) rotate(-90)" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="600">${T.yl}</text>`;
  rows.forEach(r=>{g+=`<circle cx="${X(r[T.x]).toFixed(1)}" cy="${Y(r[T.y]).toFixed(1)}" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"/>`;});
  return g+"</svg>";
}
function summaryHTML(){
  let h="";
  STATIONS.filter(s=>s.merk).forEach(s=>{const jds=(s.jd||[]).map((j,ji)=>LS.get(`jd.${s.id}.${ji}`,null)).filter(x=>x&&x.ok);
    h+=`<div class="card"><h3>${s.title}</h3>${jds.length?`<p class="small" style="margin:0 0 4px">Dein Je-desto-Satz: <b>${jds.map(x=>esc(x.text)).join(" · ")}</b></p>`:""}<details><summary>Merksatz aufdecken</summary><div class="merk">${s.merk}</div></details></div>`;});
  h+=`<div class="card"><h3>Überblick</h3><table><tr><th>Frage</th><th>Versuch</th><th>Ergebnis</th></tr>
   <tr><td>Gibt es Ladung?</td><td>V1</td><td>Geriebener Stab → Ausschlag bleibt</td></tr>
   <tr><td>Influenz</td><td>V2</td><td>Ladungstrennung ohne Berührung; Ausschlag geht zurück</td></tr>
   <tr><td>Kontakt</td><td>V3</td><td>Ladung geht über, verteilt sich über Leiter</td></tr>
   <tr><td>Gibt es eine elektrische Kraft?</td><td>V4</td><td>Zeiger ruht schräg: Gleichgewicht mit F<sub>G</sub></td></tr>
   <tr><td>Zwei Ladungsarten?</td><td>V5</td><td>+ und − heben sich auf</td></tr>
   <tr><td>Was heißt neutral?</td><td>V6</td><td>gleich viele + und −; Ladung wird nur getrennt</td></tr>
   <tr><td>Ladungsmenge</td><td>V7</td><td>Je mehr Ladung, desto größer F<sub>el</sub></td></tr>
   <tr><td>Abstand</td><td>V8</td><td>Je kleiner d, desto größer F<sub>el</sub></td></tr></table></div>`;
  h+=`<div class="card"><h3>Daten</h3><p class="small">Alle Tabellen, Antworten und Notizen sind nur auf diesem Gerät im Browser gespeichert.</p><button class="btn danger" data-act="wipe">Alle meine Daten löschen</button></div>`;
  return h;
}
panel.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const[act,a1,a2]=b.dataset.act.split(":"),r=cur;
  switch(act){
    case"rod":r.rodType=a1;updateRodLook();refreshControls();setMsg(`${RODS[a1].name} gewählt. Reiben am ${RODS[a1].cloth}.`);break;
    case"rub":rub();break;
    case"rodreset":{const rod=curRod();rod.Q=0;r.clothQ[r.rodType]=0;r.rubs=0;setMsg("Stab und Tuch entladen.");const ri=$("#rubInfo");if(ri)ri.textContent="Stab gerieben: 0×";break;}
    case"rodhome":r.tip={x:135,y:440};break;
    case"wrap":r.wrap=!r.wrap;if(r.wrap&&r.tip.x<250&&r.tip.y>480)r.tip={x:135,y:440};refreshControls();setMsg(r.wrap?"Das Tuch ist um den Stab gewickelt.":"Tuch abgenommen und auf den Tisch gelegt.");break;
    case"ground":{const e=r.es[+a1];e.grounded=!e.grounded;setMsg(e.grounded?`Finger berührt den Teller von E${+a1+1} (Erdung).`:`Finger von E${+a1+1} weggenommen.`);refreshControls();break;}
    case"bridge":r.bridge=a1==="none"?null:a1;refreshControls();setMsg(a1==="metal"?"E1 und E2 sind mit dem Metallbügel verbunden.":a1==="iso"?"E1 und E2 sind mit dem Kunststoffbügel verbunden.":"Bügel entfernt.");break;
    case"lamp":{const e=r.es[+a1];if(Math.abs(e.Q)<1.2)setMsg(`Glimmlampe an E${+a1+1}: kein Leuchten – kaum Ladung.`);else{r.lamp={i:+a1,t:0,neg:e.Q<0};setMsg(`Glimmlampe an E${+a1+1}: Beobachte, auf welcher Seite es leuchtet (Teller oder Hand)!`);}break;}
    case"src":r.srcSign=+a1;refreshControls();break;
    case"spoon":if(!r.anim)r.anim={t:0,dur:1.4,done:false};break;
    case"sign":r.sign=+a1;refreshControls();break;
    case"addq":{const sg=a1?+a1:r.sign;r.es[0].Q+=sg*PORTION;if(!a1)r.n++;setMsg(a1?`${sg>0?"Positive":"Negative"} Ladungsportion auf das Elektroskop gebracht.`:`Ladungsportion ${r.n} hinzugefügt.`);const ni=$("#nInfo");if(ni&&!a1)ni.textContent=`Ladungsportionen: ${r.n}`;break;}
    case"discharge":r.es.forEach(e=>{e.Q=0;e.finger=.7;});r.n=0;setMsg("Elektroskop mit dem Finger entladen.");{const ni=$("#nInfo");if(ni)ni.textContent=(r.sc.spoon?"Übertragene Portionen: ":"Ladungsportionen: ")+"0";}break;
    case"eloff":r.elOff=!r.elOff;refreshControls();setMsg(r.elOff?"Gedankenexperiment: Nur die Gewichtskraft wirkt.":"Die elektrische Kraft wirkt wieder.");break;
    case"reset":cache[r.cfg.id]=makeRuntime(r.cfg);cur=cache[r.cfg.id];buildScene();buildPanel();setMsg("Versuch zurückgesetzt.");break;
    case"record":{const T=r.cfg.table;
      if(T.needRest&&r.es.some(e=>Math.abs(e.om)>.04)){setMsg("Warte, bis der Zeiger ruht – erst dann ablesen!");break;}
      const rows=rowsOf(r.cfg.id);rows.push(T.rec(r));LS.set("rows."+r.cfg.id,rows);renderTable();setMsg(`Messwert ${rows.length} aufgenommen.`);break;}
    case"delrow":{const rows=rowsOf(r.cfg.id);rows.splice(+a1,1);LS.set("rows."+r.cfg.id,rows);renderTable();break;}
    case"clearrows":if(confirm("Alle Messwerte dieser Tabelle löschen?")){LS.set("rows."+r.cfg.id,[]);renderTable();}break;
    case"ans":answer(+a1,+a2);break;
    case"jd":checkJD(+a1);break;
    case"wipe":if(confirm("Wirklich alle Tabellen, Antworten und Notizen löschen?")){LS.clear();buildPanel();}break;
  }
});

/* ============ Stationen wechseln ============ */
function buildTabs(){$("#tabs").innerHTML=STATIONS.map((s,i)=>`<button data-i="${i}" class="${i===curIdx?"on":""}">${s.tab}</button>`).join("");}
$("#tabs").addEventListener("click",ev=>{const b=ev.target.closest("button");if(b)go(+b.dataset.i);});
function go(i){
  curIdx=i;const cfg=STATIONS[i];if(!cache[cfg.id])cache[cfg.id]=makeRuntime(cfg);
  cur=cache[cfg.id];drag=null;buildTabs();buildScene();buildPanel();panel.scrollTop=0;LS.set("station",i);
  const on=$("#tabs .on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});
}
const CM=["Ladungen: aus","Ladungen: Überschuss","Ladungen: alle (+ und −)"];
$("#chgToggle").addEventListener("click",()=>{chargeMode=(chargeMode+1)%3;const t=$("#chgToggle");t.classList.toggle("on",chargeMode>0);t.textContent=CM[chargeMode];});
function setHH(){document.documentElement.style.setProperty("--hh",$("#hdr").offsetHeight+"px");}
window.addEventListener("resize",()=>{setHH();resize();});
document.addEventListener("gesturestart",e=>e.preventDefault());

let last=performance.now();
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(cur){step(dt);render3D();}requestAnimationFrame(loop);}
const ok3d=initThree();
setHH();
if(ok3d){bindPointer();}
go(clamp(LS.get("station",0)|0,0,STATIONS.length-1));
resize();
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe(stage);
requestAnimationFrame(loop);
</script>
