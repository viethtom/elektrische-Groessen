<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.45}

#stage{position:relative;background:#f4f7fb;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);min-height:300px}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#ov{position:absolute;top:10px;right:10px;max-width:min(330px,46%);pointer-events:none}
#ov .box{background:rgba(255,255,255,.93);border-radius:12px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:14px}

#viewbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center}

  model:{q:"Erkläre mit dem Teilchenmodell: Warum wird der Draht warm, wenn Strom fließt – und warum wird er bei größerer Stromstärke heißer?",

  model:{q:"Erkläre mit dem Modell: Warum entsteht bei doppelter Zeit oder doppelter Stromstärke doppelt so viel Gas?",

  info:"<b>Chemische Wirkung:</b> Fließt Strom durch eine leitende Flüssigkeit, werden Stoffe zerlegt oder abgeschieden (<b>Elektrolyse</b>). Anwendungen: Verkupfern, Vergolden und Verchromen, Laden von Akkus, Herstellung von Aluminium und Wasserstoff. Die Menge des entstehenden Stoffs ist proportional zur Ladung Q = I · t. Damit kann man Ladung messen.",
  merk:"Chemische Wirkung: Strom kann leitende Flüssigkeiten zerlegen (Elektrolyse). Je größer die Stromstärke und je länger die Zeit, desto mehr Gas entsteht. Die Gasmenge ist ein Maß für die transportierte Ladung Q = I · t."
},

/* ================= Teilchenmodell ================= */
const MW=520,MH=330,VTH=60,ACC=115;
let M=null;
const ION_COL=[[293,[100,116,139]],[450,[160,110,95]],[800,[215,75,40]],[1500,[245,140,40]],[2700,[250,215,90]]];
function modelParams(r){
  switch(r.sc){
    case"start":return{kind:"wire",title:"Teilchenmodell: Blick in den Kupferdraht",T:293,Irel:r.sw?0.8:0,dir:1};
    case"heat":return{kind:"wire",title:"Teilchenmodell: Blick in den Konstantandraht",T:r.T+273,Irel:r.I/3,dir:1};
    case"light":return{kind:"wire",title:"Teilchenmodell: Blick in die Glühwendel",T:r.Tf,Irel:r.I/0.55,dir:1,light:clamp(r.E/380,0,1.5)};
    case"mag":return{kind:"mag",title:"Teilchenmodell: Blick in den Spulendraht",T:293+3*r.I*r.I,Irel:r.I/2,dir:r.pol,field:clamp(r.I/2,0,1)};
    case"chem":return{kind:"chem",title:"Teilchenmodell: Blick in die Flüssigkeit",Irel:r.I/2.5};
  }
  return{kind:"wire",title:"Teilchenmodell",T:293,Irel:0,dir:1};
}
function buildModel(kind){
  M={kind,t:0,ions:[],els:[],ph:[],bub:[],cnt:{e:0,h:0,o:0,ca:0,an:0}};
  if(kind==="chem"){
    for(let k=0;k<24;k++)M.ions.push({x:110+Math.random()*300,y:80+Math.random()*170,q:k%2?-1:1,vx:0,vy:0});
    return;
  }
  const y0=kind==="mag"?100:48,y1=kind==="mag"?210:258,rows=kind==="mag"?2:4,dy=(y1-y0)/rows;
  M.y0=y0;M.y1=y1;
  for(let i=0;i<rows;i++)for(let j=0;j<10;j++)M.ions.push({x:26+52*j+(i%2?26:0)-(i%2&&j===9?520:0),y:y0+dy*(i+.5),p1:Math.random()*6.3,p2:Math.random()*6.3,w1:15+Math.random()*6,w2:15+Math.random()*6,kick:0,fl:0,cx:0,cy:0});
  const nE=kind==="mag"?18:32;
  for(let k=0;k<nE;k++){let x,y,ok=false,tries=0;while(!ok&&tries<50){x=Math.random()*MW;y=y0+8+Math.random()*(y1-y0-16);ok=M.ions.every(o=>Math.hypot(o.x-x,o.y-y)>22);tries++;}
    const a=Math.random()*6.3;M.els.push({x,y,vx:VTH*Math.cos(a),vy:VTH*Math.sin(a)});}
}
function modelStep(dt){
  const P=modelParams(cur);if(!M||M.kind!==P.kind)buildModel(P.kind);M.t+=dt;
  if(P.kind==="chem")return chemStep(dt,P);
  const AT=1+6*Math.sqrt(Math.max(0,P.T-293)/2400);
  M.ions.forEach(o=>{o.kick*=Math.exp(-dt*1.1);o.fl*=Math.exp(-dt*6);const a=Math.min(9.5,AT+o.kick);o.cx=o.x+a*Math.sin(o.w1*M.t+o.p1);o.cy=o.y+a*Math.cos(o.w2*M.t+o.p2);});
  const acc=ACC*P.Irel*P.dir;
  M.els.forEach(e=>{
    e.vx+=acc*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(e.x>MW)e.x-=MW;if(e.x<0)e.x+=MW;
    if(e.y<M.y0+6){e.y=M.y0+6;e.vy=Math.abs(e.vy);}if(e.y>M.y1-6){e.y=M.y1-6;e.vy=-Math.abs(e.vy);}
    for(const o of M.ions){let dx=e.x-o.cx;if(dx>MW/2)dx-=MW;if(dx<-MW/2)dx+=MW;const dy=e.y-o.cy,d=Math.hypot(dx,dy);
      if(d<18&&d>0.01){const nx=dx/d,ny=dy/d;if(e.vx*nx+e.vy*ny<0){
        const E=e.vx*e.vx+e.vy*e.vy,tr=Math.max(0,E-VTH*VTH);
        if(tr>300){o.kick=Math.min(5,o.kick+tr/7000);o.fl=1;}
        let rx=e.vx-2*(e.vx*nx+e.vy*ny)*nx,ry=e.vy-2*(e.vx*nx+e.vy*ny)*ny;const ang=Math.atan2(ry,rx)+(Math.random()-.5)*1.2;
        e.vx=VTH*Math.cos(ang);e.vy=VTH*Math.sin(ang);e.x=o.cx+nx*18;e.y=o.cy+ny*18;}
        break;}}
    const sp=Math.hypot(e.vx,e.vy);if(sp>260){e.vx*=260/sp;e.vy*=260/sp;}
  });
  if(P.light&&Math.random()<dt*30*P.light){const o=M.ions[Math.floor(Math.random()*M.ions.length)];const a=Math.random()*6.3;M.ph.push({x:o.cx,y:o.cy,a,life:0});}
  M.ph.forEach(p=>{p.life+=dt;p.x+=130*Math.cos(p.a)*dt;p.y+=130*Math.sin(p.a)*dt;});M.ph=M.ph.filter(p=>p.life<1);
}
function chemStep(dt,P){
  const I=P.Irel;
  M.ions.forEach(o=>{
    o.vx+=(Math.random()-.5)*400*dt;o.vy+=(Math.random()-.5)*400*dt;o.vx*=Math.exp(-dt*2);o.vy*=Math.exp(-dt*2);
    const drift=-o.q*95*I;o.x+=(o.vx+drift)*dt;o.y+=o.vy*dt;
    if(o.y<80){o.y=80;o.vy=Math.abs(o.vy);}if(o.y>250){o.y=250;o.vy=-Math.abs(o.vy);}
    if(o.x<84){if(o.q>0&&I>0.02){M.cnt.ca++;M.cnt.e++;if(M.cnt.ca%2===0){M.cnt.h++;M.bub.push({x:80+Math.random()*6,y:o.y,r:6,k:0});}o.x=250+Math.random()*140;o.y=80+Math.random()*170;}else{o.x=84;o.vx=Math.abs(o.vx);}}
    if(o.x>436){if(o.q<0&&I>0.02){M.cnt.an++;if(M.cnt.an%4===0){M.cnt.o++;M.bub.push({x:440-Math.random()*6,y:o.y,r:7,k:1});}o.x=130+Math.random()*140;o.y=80+Math.random()*170;}else{o.x=436;o.vx=-Math.abs(o.vx);}}
  });
  M.bub.forEach(b=>{b.y-=60*dt;});M.bub=M.bub.filter(b=>b.y>78);

}

  h+=`<div class="card"><h3>Meine Notizen</h3><textarea id="notes" placeholder="Beobachtungen, eigene Je-desto-Sätze, Fragen …">${esc(LS.get("notes."+cfg.id,""))}</textarea></div>`;
  if(cfg.summary)h+=`<div class="card"><h3>Daten</h3><p class="small">Alle Tabellen, Antworten und Notizen sind nur auf diesem Gerät im Browser gespeichert.</p><button class="btn danger" data-act="wipe">Alle meine Daten löschen</button></div>`;
  panel.innerHTML=h+(window.LEGAL_LINKS||"");
  if(cfg.table)renderTable();
  if(cfg.myst)renderMyst();
  restoreAnswers();
  [["notes","notes."],["expl","expl."]].forEach(([id,k])=>{const ta=$("#"+id);if(ta)ta.addEventListener("input",()=>LS.set(k+cfg.id,ta.value));});
  bindSlider();
}
function bindSlider(){const sl=$("#uSlider");if(sl)sl.addEventListener("input",()=>setU(+sl.value));}
function setU(v){const r=cur,[a,b,st]=r.cfg.u;r.U=clamp(Math.round(v/st)*st,a,b);const sl=$("#uSlider"),lb=$("#uVal");if(sl&&+sl.value!==r.U)sl.value=r.U;if(lb)lb.textContent=fmt(r.U,st<0.5?2:1)+" V";
  if(r.sc==="light"&&r.U>6)setMsg("Achtung: Die Nennspannung der Lampe (6 V) ist überschritten – die Lampe altert dann sehr schnell.");}
function refreshControls(){const c=$("#ctrl");if(c){c.innerHTML=controlsHTML();bindSlider();}}
function setMsg(t){if(!cur)return;cur.msg=t;const m=$("#msg");if(m)m.textContent=t;}
function jdHTML(cfg,prompt,ji){
  const J=cfg.jd,saved=LS.get(`jd.${cfg.id}.${ji}`,null);
  const sel=(p,opts)=>`<select data-p="${p}"><option value="">…</option>${opts.map(o=>`<option ${saved&&saved.v[p]===o?"selected":""}>${o}</option>`).join("")}</select>`;
  return `<div class="jd" data-ji="${ji}" style="margin-bottom:12px"><p class="prompt">${prompt}</p>Je ${sel(0,A1)} ${sel(1,J.qty)}, desto ${sel(2,A2)} ${sel(3,J.res)}. <button class="btn" data-act="jd:${ji}" style="margin-left:4px">Prüfen</button><div class="fb ${saved&&saved.ok?"ok":""}">${saved&&saved.ok?"✓ Richtig! "+saved.h:""}</div></div>`;
}
function checkJD(ji){
  const cfg=cur.cfg,J=cfg.jd,box=panel.querySelector(`.jd[data-ji="${ji}"]`),fb=box.querySelector(".fb");
  const v=[...box.querySelectorAll("select")].map(s=>s.value);const no=t=>{fb.className="fb no";fb.textContent=t;LS.set(`jd.${cfg.id}.${ji}`,{v,ok:false});};
  if(v.some(x=>!x))return no("Fülle zuerst alle Lücken aus.");
  if(!FIT[v[1]].includes(v[0])||!FIT[v[3]].includes(v[2]))return no("Prüfe die Adjektive: Passt das Wort zur Größe? Man sagt zum Beispiel „je länger die Zeit“, „desto höher die Temperatur“ oder „desto heller leuchtet die Lampe“.");
  const near=(J.near||[]).find(n=>n.q===v[1]);if(near)return no(near.msg);
  const m=J.ok.find(o=>o.q===v[1]&&o.r.includes(v[3]));
  if(!m)return no("Diese Kombination passt nicht zu deinem Versuch. Welche Größe hast du verändert, welche hast du gemessen?");
  if(ADJ[v[0]]*ADJ[v[2]]!==m.rel)return no("Die Größen stimmen, aber die Richtung nicht. Schau in deine Tabelle: Was passiert mit der gemessenen Größe, wenn die veränderte Größe wächst?");
  const text=`Je ${v[0]} ${v[1]}, desto ${v[2]} ${v[3]}.`;
  const dup=J.slots.some((_,k)=>k!==ji&&(LS.get(`jd.${cfg.id}.${k}`,{})||{}).text===text&&LS.get(`jd.${cfg.id}.${k}`,{}).ok);
  if(dup)return no("Der Satz stimmt – aber du hast ihn schon. Hier ist ein anderer Zusammenhang gefragt.");
  fb.className="fb ok";fb.textContent="✓ Richtig! "+m.h;
  LS.set(`jd.${cfg.id}.${ji}`,{v,ok:true,text,h:m.h});
}
function answer(qi,oi){
  const q=cur.cfg.qs[qi],box=panel.querySelector(`.q[data-qi="${qi}"]`),fb=box.querySelector(".fb"),btn=box.querySelectorAll(".opt")[oi];
  if(oi===q.c){box.querySelectorAll(".opt").forEach(b=>b.classList.remove("wrong"));btn.classList.add("right");fb.className="fb ok";fb.innerHTML="✓ Richtig! "+(q.ex||"");const a=LS.get("ans."+cur.cfg.id,{});a[qi]=oi;LS.set("ans."+cur.cfg.id,a);}
  else{btn.classList.add("wrong");fb.className="fb no";fb.textContent="Leider nicht. Beobachte den Versuch noch einmal genau und versuche es erneut.";}
}
function restoreAnswers(){
  const a=LS.get("ans."+cur.cfg.id,{});Object.keys(a).forEach(qi=>{const q=cur.cfg.qs&&cur.cfg.qs[qi];if(!q)return;const box=panel.querySelector(`.q[data-qi="${qi}"]`);if(!box)return;
    box.querySelectorAll(".opt")[q.c].classList.add("right");const fb=box.querySelector(".fb");fb.className="fb ok";fb.innerHTML="✓ Richtig! "+(q.ex||"");});
}
/* ---------- Tabelle und Diagramm ---------- */
const PAL=["#2563eb","#dc2626","#059669","#d97706","#7c3aed","#0891b2","#be185d"];
function rowsOf(id){return LS.get("rows."+id,[]);}
function renderTable(){
  const cfg=cur.cfg,T=cfg.table,rows=rowsOf(cfg.id),el=$("#tbl");
  let h=`<table><thead><tr><th>Nr.</th>${T.cols.map(c=>`<th>${c.l}</th>`).join("")}<th></th></tr></thead><tbody>`;
  if(!rows.length)h+=`<tr><td colspan="${T.cols.length+2}" class="small">Noch keine Messwerte.</td></tr>`;
  rows.forEach((row,i)=>{h+=`<tr><td>${i+1}</td>${T.cols.map(c=>`<td>${c.txt?esc(row[c.k]):fmt(row[c.k],c.d)}</td>`).join("")}<td><button class="x" data-act="delrow:${i}" aria-label="Zeile löschen">×</button></td></tr>`;});
  h+=`</tbody></table>`;
  if(rows.length){const ai=clamp(LS.get("axis."+cfg.id,0)|0,0,T.axes.length-1);
    if(T.axes.length>1)h+=`<div class="seg axis">${T.axes.map((a,k)=>`<button class="btn ${k===ai?"on":""}" data-act="axis:${k}">${a.n}</button>`).join("")}</div>`;
    h+=chartSVG(rows,T,T.axes[ai]);}
  el.innerHTML=h;
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p;}
function chartSVG(rows,T,A){
  const Wd=360,Hd=250,L=50,B=42,Rr=12,Tt=12,xs=rows.map(r=>r[A.x]),ys=rows.map(r=>r[A.y]);
  const xm=niceMax(Math.max(...xs,0)*1.05),ymx=Math.max(...ys,0),ymn=Math.min(...ys,0);
  const yTop=ymx>0?niceMax(ymx*1.05):0,yBot=ymn<0?-niceMax(-ymn*1.05):0,ySpan=(yTop-yBot)||1;
  const X=v=>L+(Wd-L-Rr)*v/xm,Y=v=>Hd-B-(Hd-B-Tt)*(v-yBot)/ySpan;
  const dx=xm<5?(xm<1?2:1):0,dy=ySpan<5?1:0;
  let g=`<svg class="chart" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="${esc(A.yl)} über ${esc(A.xl)}"><rect width="${Wd}" height="${Hd}" fill="#fff"/>`;
  for(let k=0;k<=5;k++){const xv=xm*k/5,yv=yBot+ySpan*k/5;
    g+=`<line x1="${X(xv)}" y1="${Tt}" x2="${X(xv)}" y2="${Hd-B}" stroke="#eef2f7"/><line x1="${L}" y1="${Y(yv)}" x2="${Wd-Rr}" y2="${Y(yv)}" stroke="#eef2f7"/>`;
    g+=`<text x="${X(xv)}" y="${Hd-B+16}" font-size="11" text-anchor="middle" fill="#475569">${fmt(xv,dx)}</text><text x="${L-6}" y="${Y(yv)+4}" font-size="11" text-anchor="end" fill="#475569">${fmt(yv,dy)}</text>`;}
  g+=`<line x1="${L}" y1="${Y(0)}" x2="${Wd-Rr}" y2="${Y(0)}" stroke="#334155" stroke-width="1.5"/><line x1="${L}" y1="${Tt}" x2="${L}" y2="${Hd-B}" stroke="#334155" stroke-width="1.5"/>`;
  g+=`<text x="${(L+Wd-Rr)/2}" y="${Hd-6}" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="600">${A.xl}</text><text transform="translate(13,${(Tt+Hd-B)/2}) rotate(-90)" font-size="12.5" text-anchor="middle" fill="#0f172a" font-weight="600">${A.yl}</text>`;
  const groups=[];rows.forEach(r=>{const gk=T.g?T.g(r):"";if(!groups.includes(gk))groups.push(gk);});
  rows.forEach(r=>{const gi=groups.indexOf(T.g?T.g(r):"");g+=`<circle cx="${X(r[A.x]).toFixed(1)}" cy="${Y(r[A.y]).toFixed(1)}" r="5" fill="${PAL[gi%PAL.length]}" stroke="#fff" stroke-width="1.5"/>`;});
  g+="</svg>";
  if(T.g&&groups.length)g+=`<div class="leg">${groups.map((k,i)=>`<span><span class="cl" style="background:${PAL[i%PAL.length]}"></span>${esc(k)}</span>`).join("")}</div>`;
  return g;
}
function record(){
  const r=cur,id=r.cfg.id;
  if(r.myst){setMsg("Beim Rätselstrom werden keine Messwerte aufgenommen.");return;}
  let row=null;
  switch(r.sc){
    case"heat":if(Math.abs(heatTs(r.I)-r.T)>1.5){setMsg("Warte, bis sich die Temperatur nicht mehr ändert – erst dann ablesen!");return;}
      row={u:r.U,i:r2(r.I),t:Math.round(r.T),s:r1(r.s)};break;
    case"light":row={u:r.U,i:r2(r.I),e:r.E<100?r1(r.E):Math.round(r.E)};break;
    case"mag":if(Math.abs(r.F-r.Fd)>2){setMsg("Warte, bis der Magnet ruhig hängt – erst dann ablesen!");return;}
      row={n:r.N,k:r.core?"mit":"ohne",i:r2(r.I),f:Math.round(r.Fd)};break;
    case"chem":if(r.time<1){setMsg("Schließe zuerst den Schalter und lass die Uhr laufen.");return;}
      row={i:r2(r.Q/r.time),t:Math.round(r.time),q:Math.round(r.Q),vh:r1(r.VH),vo:r1(r.VO)};break;
  }
  const rows=rowsOf(id);rows.push(row);LS.set("rows."+id,rows);renderTable();
  setMsg(`Messwert ${rows.length} aufgenommen.`+(r.sc==="chem"&&r.changed?" Achtung: Du hast die Spannung während der Messung verändert – I ist hier ein Mittelwert.":""));
}
/* ---------- Rätselstrom ---------- */
function renderMyst(){
  const r=cur,b=$("#mystBox");if(!b)return;
  if(!r.myst){b.innerHTML=`<button class="btn primary" data-act="myst">Rätselstrom einschalten</button>`;return;}
  b.innerHTML=`<div style="margin-bottom:8px">Meine Bestimmung: I ≈ <input id="mystIn" type="text" inputmode="decimal" placeholder="z. B. 1,2" value="${esc(r.myst.guess||"")}"> A</div>
   <div class="btns"><button class="btn primary" data-act="mystcheck">Prüfen</button><button class="btn" data-act="mystshow">Auflösen</button><button class="btn" data-act="mystend">Rätsel beenden</button></div><div class="fb" id="mystFb"></div>`;
  const inp=$("#mystIn");inp.addEventListener("input",()=>{r.myst.guess=inp.value;});
}
function mystI(r){const save=r.run;if(r.sc==="chem")r.run=true;const I=current(r);r.run=save;return I;}
function mystCheck(show){
  const r=cur,fb=$("#mystFb"),I=mystI(r);
  if(show){fb.className="fb ok";fb.textContent=`Die Stromstärke beträgt ${fmt(I,2)} A.`;return;}
  const g=parseFloat(String($("#mystIn").value).replace(",","."));
  if(!isFinite(g)){fb.className="fb no";fb.textContent="Gib eine Zahl ein, z. B. 1,2.";return;}
  const tol=Math.max(0.06,0.1*I);
  if(Math.abs(g-I)<=tol){fb.className="fb ok";fb.textContent=`✓ Sehr gut! Die Stromstärke beträgt ${fmt(I,2)} A. Du hast die Wirkung als Messgerät benutzt – genau so funktionieren Strommessgeräte.`;}
  else{fb.className="fb no";fb.textContent=`Noch nicht – dein Wert ist zu ${g>I?"groß":"klein"}. Lies noch einmal genau ab und vergleiche mit deiner Tabelle oder dem Diagramm.`;}
}
/* ---------- Fazit ---------- */
function summaryHTML(){
  let h=`<div class="card"><h3>Überblick</h3><table class="ov-tbl"><tr><th>Wirkung</th><th>Was ändert sich?</th><th>Nutzung zum Messen</th></tr>
   <tr><td>Wärme</td><td>Temperatur, Länge des Drahts</td><td>Hitzdraht-Messgerät</td></tr>
   <tr><td>Licht</td><td>Helligkeit</td><td>nur grobe Anzeige</td></tr>
   <tr><td>Magnetisch</td><td>Kraft (F ~ I)</td><td>Drehspul-Messgerät – die meisten Amperemeter</td></tr>
   <tr><td>Chemisch</td><td>Gasmenge (V ~ Q = I · t)</td><td>Ladung messen</td></tr></table></div>`;
  STATIONS.filter(s=>s.jd).forEach(s=>{const jds=s.jd.slots.map((_,ji)=>LS.get(`jd.${s.id}.${ji}`,null)).filter(x=>x&&x.ok);
    h+=`<div class="card"><h3>${s.title}</h3>${jds.length?`<p class="small" style="margin:0 0 4px">Deine Je-desto-Sätze:</p><ul style="margin:0 0 6px;padding-left:20px">${jds.map(x=>`<li><b>${esc(x.text)}</b></li>`).join("")}</ul>`:`<p class="small" style="margin:0 0 4px">Noch keine Je-desto-Sätze – bilde sie im Versuch.</p>`}<details><summary>Merksatz aufdecken</summary><div class="merk">${s.merk}</div></details></div>`;});
  return h;
}
/* ================= Ereignisse ================= */
panel.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b||b.disabled)return;doAction(b.dataset.act);});
function doAction(s){
  const[act,a1,a2]=s.split(":"),r=cur;
  switch(act){
    case"ncyc":{const ns=[300,600,1200];r.N=ns[(ns.indexOf(r.N)+1)%3];refreshControls();setMsg(`Spule mit ${r.N} Windungen eingesetzt.`);break;}
    case"sw":r.sw=!r.sw;refreshControls();setMsg(r.sw?"Schalter geschlossen – der Stromkreis ist geschlossen.":"Schalter geöffnet – der Stromkreis ist unterbrochen.");break;
    case"u":setU(r.U+(+a1)*r.cfg.u[2]);break;
    case"u0":setU(0);break;
    case"riders":r.riders=newRiders();r.fellMsg=false;setMsg("Neue Papierreiter aufgesetzt.");break;
    case"n":r.N=+a1;refreshControls();setMsg(`Spule mit ${a1} Windungen eingesetzt.`);break;
    case"core":r.core=!r.core;refreshControls();setMsg(r.core?"Eisenkern eingesetzt.":"Eisenkern herausgenommen.");break;
    case"pol":r.pol=-r.pol;refreshControls();setMsg(r.pol<0?"Umgepolt: Der Strom fließt jetzt in der anderen Richtung durch die Spule.":"Wieder normal gepolt.");break;
    case"run":r.run=!r.run;refreshControls();setMsg(r.run?"Schalter geschlossen – die Stoppuhr läuft.":"Schalter geöffnet – die Stoppuhr hält an. Jetzt ablesen!");break;
    case"clk0":r.run=false;r.time=0;r.Q=0;r.VH=0;r.VO=0;r.bub=[];r.changed=false;refreshControls();setMsg("Gas abgelassen, Stoppuhr auf 0.");break;
    case"reset":{const m=r.myst;cache[r.cfg.id]=makeRuntime(r.cfg);cur=cache[r.cfg.id];cur.myst=null;M=null;build3();buildPanel();setMsg("Versuch zurückgesetzt.");break;}
    case"record":record();break;
    case"delrow":{const rows=rowsOf(r.cfg.id);rows.splice(+a1,1);LS.set("rows."+r.cfg.id,rows);renderTable();break;}
    case"clearrows":if(confirm("Alle Messwerte dieser Tabelle löschen?")){LS.set("rows."+r.cfg.id,[]);renderTable();}break;
    case"axis":LS.set("axis."+r.cfg.id,+a1);renderTable();break;
    case"ans":answer(+a1,+a2);break;
    case"jd":checkJD(+a1);break;
    case"model":setModel(!modelOn);break;
    case"myst":{const[lo,hi]=r.cfg.myst;r.myst={U:Math.round((lo+Math.random()*(hi-lo))*20)/20,guess:""};
      if(r.sc==="chem"){r.run=false;r.time=0;r.Q=0;r.VH=0;r.VO=0;r.bub=[];}
      if(r.sc==="heat")r.riders=newRiders();
      refreshControls();renderMyst();setMsg("Rätselstrom eingeschaltet. Lies die Wirkung ab!");break;}
    case"mystcheck":mystCheck(false);break;
    case"mystshow":mystCheck(true);break;
    case"mystend":r.myst=null;if(r.sc==="chem"){r.run=false;r.time=0;r.Q=0;r.VH=0;r.VO=0;r.bub=[];}refreshControls();renderMyst();setMsg("Rätsel beendet.");break;
    case"wipe":if(confirm("Wirklich alle Tabellen, Antworten und Notizen löschen?")){LS.clear();buildPanel();}break;
  }
}
function setModel(on){modelOn=on;document.body.classList.toggle("model",on);const t=$("#modelToggle");t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);t.textContent=on?"🔬 Modell: an":"🔬 Modell";
  const mb=$("#mBtn");if(mb){mb.classList.toggle("on",on);mb.textContent=on?"Modell ausblenden":"Modell anzeigen";}
  requestAnimationFrame(()=>{setHH();resizeAll();});}
$("#modelToggle").addEventListener("click",()=>setModel(!modelOn));

/* ================= Stationen wechseln ================= */
function buildTabs(){$("#tabs").innerHTML=STATIONS.map((s,i)=>`<button data-i="${i}" class="${i===curIdx?"on":""}">${s.tab}</button>`).join("");}
$("#tabs").addEventListener("click",ev=>{const b=ev.target.closest("button");if(b)go(+b.dataset.i);});
function go(i){
  curIdx=i;const cfg=STATIONS[i];if(!cache[cfg.id])cache[cfg.id]=makeRuntime(cfg);
  cur=cache[cfg.id];M=null;build3();buildTabs();buildPanel();panel.scrollTop=0;LS.set("station",i);
  const on=$("#tabs .on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});
}
function setHH(){document.documentElement.style.setProperty("--hh",$("#hdr").offsetHeight+"px");}
window.addEventListener("resize",()=>{setHH();resizeAll();});
document.addEventListener("gesturestart",e=>e.preventDefault());

let last=performance.now(),ovT=0,ovHTML="";
function loop(now){
  const dt=Math.min(.04,(now-last)/1000);last=now;
  if(cur){step(dt);if(ok3d){if(modelOn)modelStep3(dt);render3();}else{if(modelOn)modelStep(dt);render();}
    ovT-=dt;if(ovT<=0){ovT=0.12;const ro=readout(cur),h=ro?`<div class="box"><b class="h">Messwerte</b>${ro}</div>`:"";if(h!==ovHTML){ovHTML=h;ov.innerHTML=h;}}}
  requestAnimationFrame(loop);
}
ok3d=initThree();
if(ok3d){stage.appendChild(vb);vb.style.bottom="auto";$("#viewReset").addEventListener("click",()=>{cam.yaw=-0.38;cam.pitch=0.34;cam.zoom=1;applyCam();mYaw=0.55;mPitch=0.22;});}
setHH();
go(clamp(LS.get("station",0)|0,0,STATIONS.length-1));
resizeAll();
if(window.ResizeObserver)new ResizeObserver(()=>resizeAll()).observe(stage);
requestAnimationFrame(loop);
</script>
